<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-rt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="card-grad-rt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Headers -->
    <linearGradient id="hdr-blue-rt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="hdr-purple-rt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hdr-emerald-rt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="hdr-amber-rt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-blue-rt" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arr-purple-rt" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-emerald-rt" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow-rt" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="660" rx="12" fill="url(#bg-grad-rt)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Banner -->
  <g transform="translate(40, 24)">
    <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="0.3">
      SOF LLEXT Runtime Lifecycle &amp; Memory Protection State Machine
    </text>
    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#94a3b8">
      Host IPC4 Dynamic Loading Handshake, Virtual Memory Mapping, Cache Synchronization, and Lifecycle Management
    </text>
  </g>

  <!-- Top Left: Host Driver Trigger & IPC4 Protocol -->
  <g transform="translate(40, 85)" filter="url(#shadow-rt)">
    <rect width="490" height="200" rx="10" fill="url(#card-grad-rt)" stroke="#2563eb" stroke-width="1.2"/>
    <rect width="490" height="28" rx="10" fill="url(#hdr-blue-rt)"/>
    <rect y="20" width="490" height="8" fill="#2563eb"/>
    <text x="20" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      Phase 1: Linux Host Driver Handshake (sound/soc/sof/ipc4-loader.c)
    </text>

    <!-- Step Items -->
    <g transform="translate(16, 42)">
      <!-- Step 1.1 -->
      <g transform="translate(0, 0)">
        <rect width="458" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="12" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#60a5fa">1. Topology UUID Request</text>
        <text x="12" y="32" font-family="system-ui, sans-serif" font-size="8.5" fill="#cbd5e1">
          Pipeline creation requests module UUID; driver loads <tspan font-family="monospace" fill="#93c5fd">/lib/firmware/.../${UUID}.bin</tspan>
        </text>
      </g>

      <!-- Step 1.2 -->
      <g transform="translate(0, 48)">
        <rect width="458" height="42" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="0.8"/>
        <text x="12" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#60a5fa">2. IPC4_GLB_LOAD_LIBRARY_PREPARE</text>
        <text x="12" y="32" font-family="system-ui, sans-serif" font-size="8.5" fill="#cbd5e1">
          Host sets up DMA buffer; allocates DSP <tspan font-family="monospace" fill="#38bdf8">dma_id</tspan> and assigns module <tspan font-family="monospace" fill="#38bdf8">lib_id</tspan>.
        </text>
      </g>

      <!-- Step 1.3 -->
      <g transform="translate(0, 96)">
        <rect width="458" height="48" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
        <text x="12" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#93c5fd">3. DMA Transfer &amp; IPC4_GLB_LOAD_LIBRARY</text>
        <text x="12" y="32" font-family="system-ui, sans-serif" font-size="8.5" fill="#cbd5e1">
          Host streams binary container into DSP staging buffer; sends trigger to execute load.
        </text>
      </g>
    </g>
  </g>

  <!-- Top Right: Ingestion, Authentication & ABI Check -->
  <g transform="translate(570, 85)" filter="url(#shadow-rt)">
    <rect width="490" height="200" rx="10" fill="url(#card-grad-rt)" stroke="#7c3aed" stroke-width="1.2"/>
    <rect width="490" height="28" rx="10" fill="url(#hdr-purple-rt)"/>
    <rect y="20" width="490" height="8" fill="#7c3aed"/>
    <text x="20" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      Phase 2: Ingestion, Crypto Verify &amp; ABI Validation (lib_manager.c)
    </text>

    <!-- Step Items -->
    <g transform="translate(16, 42)">
      <!-- Step 2.1 -->
      <g transform="translate(0, 0)">
        <rect width="458" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="12" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#c084fc">1. Cryptographic Manifest Verification</text>
        <text x="12" y="32" font-family="system-ui, sans-serif" font-size="8.5" fill="#cbd5e1">
          Validates CSS signature ($MN2) and ADSP descriptor ($AM1) against platform keys.
        </text>
      </g>

      <!-- Step 2.2 -->
      <g transform="translate(0, 48)">
        <rect width="458" height="42" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="0.8"/>
        <text x="12" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#d8b4fe">2. ABI Version Handshake</text>
        <text x="12" y="32" font-family="system-ui, sans-serif" font-size="8.5" fill="#e9d5ff">
          Verifies: <tspan font-family="monospace" fill="#38bdf8">buildinfo-&gt;api_version_number == SOF_MODULE_API_CURRENT_VERSION</tspan>
        </text>
      </g>

      <!-- Step 2.3 -->
      <g transform="translate(0, 96)">
        <rect width="458" height="48" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
        <text x="12" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f0abfc">3. Library Context Registration</text>
        <text x="12" y="32" font-family="system-ui, sans-serif" font-size="8.5" fill="#cbd5e1">
          Allocates <tspan font-family="monospace">struct lib_manager_mod_ctx</tspan>; stores manifest and segment table.
        </text>
      </g>
    </g>
  </g>

  <!-- Middle Band: Zephyr LLEXT Linking & Memory Protection State Machine -->
  <g transform="translate(40, 305)" filter="url(#shadow-rt)">
    <rect width="1020" height="185" rx="10" fill="url(#card-grad-rt)" stroke="#059669" stroke-width="1.2"/>
    <rect width="1020" height="28" rx="10" fill="url(#hdr-emerald-rt)"/>
    <rect y="20" width="1020" height="8" fill="#059669"/>
    <text x="20" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      Phase 3: Virtual Memory Mapping, Section Relocation &amp; Permission State Machine (llext_manager.c)
    </text>

    <!-- 5 Progressive Sub-blocks -->
    <g transform="translate(16, 42)">
      <!-- Stage A: Writable Mapping -->
      <g transform="translate(0, 0)">
        <rect width="186" height="125" rx="6" fill="#0f172a" stroke="#059669" stroke-width="0.8"/>
        <text x="10" y="18" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#6ee7b7">A. Temporary RW Map</text>
        <text x="10" y="34" font-family="monospace" font-size="8" fill="#34d399">sys_mm_drv_align_map()</text>
        <text x="10" y="48" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">• Initial permission:</text>
        <text x="16" y="60" font-family="monospace" font-size="7.5" fill="#fbbf24">SYS_MM_MEM_PERM_RW</text>
        <text x="10" y="74" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">• Aligned to 4KB page</text>
        <text x="10" y="88" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Allows loader to copy</text>
        <text x="10" y="100" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">data &amp; patch symbols.</text>
      </g>

      <!-- Stage B: Relocation & Copy -->
      <g transform="translate(200, 0)">
        <rect width="186" height="125" rx="6" fill="#0f172a" stroke="#059669" stroke-width="0.8"/>
        <text x="10" y="18" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#6ee7b7">B. Relocation &amp; Copy</text>
        <text x="10" y="34" font-family="monospace" font-size="8" fill="#34d399">llext_load() engine</text>
        <text x="10" y="48" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">• Copy .text, .rodata, .data</text>
        <text x="10" y="62" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">• Zero .bss section</text>
        <text x="10" y="76" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">• Patch Xtensa opcodes</text>
        <text x="10" y="90" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">• Link EXPORT_SYMBOL</text>
        <text x="10" y="104" font-family="system-ui, sans-serif" font-size="7.5" fill="#94a3b8">Resolves all imports.</text>
      </g>

      <!-- Stage C: D-Cache Writeback -->
      <g transform="translate(400, 0)">
        <rect width="186" height="125" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="0.8"/>
        <text x="10" y="18" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#fcd34d">C. D-Cache Flush</text>
        <text x="10" y="34" font-family="monospace" font-size="8" fill="#fbbf24">dcache_writeback_region()</text>
        <text x="10" y="48" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">• Mandatory before</text>
        <text x="16" y="60" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">changing MMU flags</text>
        <text x="10" y="74" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">• Flushes patched code</text>
        <text x="10" y="88" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">from L1/L2 data cache</text>
        <text x="10" y="102" font-family="system-ui, sans-serif" font-size="7.5" fill="#94a3b8">into physical SRAM.</text>
      </g>

      <!-- Stage D: Permissions Locking -->
      <g transform="translate(600, 0)">
        <rect width="186" height="125" rx="6" fill="#0f172a" stroke="#059669" stroke-width="0.8"/>
        <text x="10" y="18" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#6ee7b7">D. Permission Lockdown</text>
        <text x="10" y="34" font-family="monospace" font-size="8" fill="#34d399">update_region_flags()</text>
        <text x="10" y="48" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">• <tspan font-family="monospace" fill="#38bdf8">.text</tspan> -&gt; RX (EXEC)</text>
        <text x="10" y="62" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">• <tspan font-family="monospace" fill="#e2e8f0">.rodata</tspan> -&gt; Read-Only</text>
        <text x="10" y="76" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">• <tspan font-family="monospace" fill="#c084fc">.data/.bss</tspan> -&gt; Read-Write</text>
        <text x="10" y="90" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Enforces W^X security:</text>
        <text x="10" y="102" font-family="system-ui, sans-serif" font-size="7.5" fill="#94a3b8">No writable &amp; exec pages.</text>
      </g>

      <!-- Stage E: I-Cache Invalidation -->
      <g transform="translate(800, 0)">
        <rect width="186" height="125" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="0.8"/>
        <text x="10" y="18" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#fcd34d">E. I-Cache Invalidate</text>
        <text x="10" y="34" font-family="monospace" font-size="8" fill="#fbbf24">icache_invalidate_region()</text>
        <text x="10" y="48" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">• Clears stale instruction</text>
        <text x="16" y="60" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">cache lines on all cores</text>
        <text x="10" y="74" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">• Guarantees pipeline fetches</text>
        <text x="10" y="88" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">newly written opcodes</text>
        <text x="10" y="102" font-family="system-ui, sans-serif" font-size="7.5" fill="#94a3b8">Safe for DSP execution.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Left: Pipeline Instantiation -->
  <g transform="translate(40, 505)" filter="url(#shadow-rt)">
    <rect width="490" height="130" rx="10" fill="url(#card-grad-rt)" stroke="#2563eb" stroke-width="1.2"/>
    <rect width="490" height="24" rx="10" fill="url(#hdr-blue-rt)"/>
    <rect y="18" width="490" height="6" fill="#2563eb"/>
    <text x="20" y="16" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">
      Phase 4: Module Allocation &amp; Audio Processing
    </text>

    <g transform="translate(16, 32)">
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">
        • <tspan font-family="monospace" fill="#38bdf8">llext_manager_allocate_module()</tspan>: checks dependencies, increments refcount (<tspan font-family="monospace" fill="#60a5fa">n_dependent</tspan>).
      </text>
      <text x="10" y="36" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">
        • Calls module <tspan font-family="monospace" fill="#38bdf8">entry_point()</tspan> -&gt; returns pointer to <tspan font-family="monospace" fill="#60a5fa">struct module_interface</tspan>.
      </text>
      <text x="10" y="54" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">
        • Hooks into LL/DP scheduler: calls <tspan font-family="monospace" fill="#34d399">module_adapter_process()</tspan> per 1 ms audio tick.
      </text>
      <text x="10" y="72" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">
        Audio processing runs with native performance; zero virtualization or IPC overhead.
      </text>
    </g>
  </g>

  <!-- Bottom Right: Teardown & DRAM Staging -->
  <g transform="translate(570, 505)" filter="url(#shadow-rt)">
    <rect width="490" height="130" rx="10" fill="url(#card-grad-rt)" stroke="#d97706" stroke-width="1.2"/>
    <rect width="490" height="24" rx="10" fill="url(#hdr-amber-rt)"/>
    <rect y="18" width="490" height="6" fill="#d97706"/>
    <text x="20" y="16" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">
      Phase 5: Unloading &amp; Cold-Store DRAM Staging
    </text>

    <g transform="translate(16, 32)">
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">
        • Pipeline free: <tspan font-family="monospace" fill="#fbbf24">llext_manager_free_module()</tspan> decrements reference count.
      </text>
      <text x="10" y="36" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">
        • IPC4 <tspan font-family="monospace" fill="#fbbf24">UNLOAD_LIBRARY</tspan>: unmaps virtual memory, frees SRAM pages.
      </text>
      <text x="10" y="54" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">
        • D3 Power State: <tspan font-family="monospace" fill="#f59e0b">llext_manager_store_to_dram()</tspan> backs up modules into host DRAM;
      </text>
      <text x="10" y="70" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">
        restores instantly on wake without requiring host driver to re-stream over DMA.
      </text>
    </g>
  </g>
</svg>
