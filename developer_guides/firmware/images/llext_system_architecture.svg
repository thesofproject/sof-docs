<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-sys" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="card-grad-sys" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Header Bars -->
    <linearGradient id="hdr-blue-sys" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="hdr-purple-sys" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hdr-emerald-sys" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="hdr-amber-sys" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Block Gradients -->
    <linearGradient id="blk-cyan-sys" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="blk-indigo-sys" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="blk-emerald-sys" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-blue-sys" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arr-purple-sys" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-emerald-sys" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-amber-sys" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow-sys" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="640" rx="12" fill="url(#bg-grad-sys)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Banner -->
  <g transform="translate(40, 24)">
    <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="0.3">
      SOF LLEXT Dynamic Loadable Modules: System Architecture
    </text>
    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#94a3b8">
      Modular Run-Time Extension Subsystem Bridging Base Firmware, Zephyr LLEXT API, and Audio Pipelines
    </text>
  </g>

  <!-- Left Card: Base Firmware Core & Exported Symbols -->
  <g transform="translate(40, 85)" filter="url(#shadow-sys)">
    <rect width="490" height="275" rx="10" fill="url(#card-grad-sys)" stroke="#2563eb" stroke-width="1.2"/>
    <rect width="490" height="28" rx="10" fill="url(#hdr-blue-sys)"/>
    <rect y="20" width="490" height="8" fill="#2563eb"/>
    <text x="20" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      Base Firmware Core Subsystems &amp; Export Table
    </text>

    <!-- Core Blocks -->
    <g transform="translate(20, 42)">
      <!-- Sub-block 1: Scheduler & IPC -->
      <rect width="215" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#60a5fa">Audio Engine &amp; Dispatch</text>
      <text x="12" y="36" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• LL &amp; DP Task Schedulers</text>
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• IPC4 Command Protocol Engine</text>

      <!-- Sub-block 2: Buffer & Memory Mgmt -->
      <rect x="235" width="215" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <text x="247" y="20" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#60a5fa">Audio Buffers &amp; Heap</text>
      <text x="247" y="36" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Audio Circular Ring Buffers</text>
      <text x="247" y="50" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• rballoc / rfree Heap Allocators</text>

      <!-- Sub-block 3: Symbol Export Table -->
      <rect y="72" width="450" height="90" rx="6" fill="url(#blk-indigo-sys)" stroke="#6366f1" stroke-width="1"/>
      <text x="14" y="92" font-family="monospace" font-size="10.5" font-weight="700" fill="#a5b4fc">EXPORT_SYMBOL() Global Linkage Table</text>
      <text x="14" y="110" font-family="ui-monospace, monospace" font-size="8.5" fill="#e0e7ff">
        • Logging: <tspan fill="#38bdf8">tr_err, tr_warn, tr_info</tspan> | Safety: <tspan fill="#38bdf8">memcpy_s, memset_s</tspan>
      </text>
      <text x="14" y="126" font-family="ui-monospace, monospace" font-size="8.5" fill="#e0e7ff">
        • Notifiers: <tspan fill="#38bdf8">notifier_register, notifier_unregister, notifier_event</tspan>
      </text>
      <text x="14" y="142" font-family="ui-monospace, monospace" font-size="8.5" fill="#e0e7ff">
        • Clocks: <tspan fill="#38bdf8">cpu_clock_manager_request, cpu_clock_manager_release</tspan>
      </text>
      <text x="14" y="156" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">
        Base firmware exposes safe public symbols; module unresolved symbols linked dynamically
      </text>

      <!-- Sub-block 4: Basefw API Version Badge -->
      <rect y="172" width="450" height="42" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="14" y="190" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#93c5fd">Base Firmware ABI Handshake:</text>
      <text x="14" y="204" font-family="monospace" font-size="9" fill="#bfdbfe">
        SOF_MODULE_API_CURRENT_VERSION <tspan font-family="system-ui, sans-serif" fill="#94a3b8">(Enforces binary compatibility with loaded LLEXT)</tspan>
      </text>
    </g>
  </g>

  <!-- Right Card: LLEXT Relocatable Dynamic Module Structure -->
  <g transform="translate(570, 85)" filter="url(#shadow-sys)">
    <rect width="490" height="275" rx="10" fill="url(#card-grad-sys)" stroke="#7c3aed" stroke-width="1.2"/>
    <rect width="490" height="28" rx="10" fill="url(#hdr-purple-sys)"/>
    <rect y="20" width="490" height="8" fill="#7c3aed"/>
    <text x="20" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      Dynamic LLEXT Module Binary (.llext / .ri)
    </text>

    <!-- Module Anatomy Blocks -->
    <g transform="translate(20, 42)">
      <!-- Row 1: Code & Constants -->
      <rect width="215" height="46" rx="6" fill="url(#blk-cyan-sys)" stroke="#06b6d4" stroke-width="1"/>
      <text x="12" y="18" font-family="monospace" font-size="10" font-weight="700" fill="#67e8f9">.text &amp; .literal</text>
      <text x="12" y="32" font-family="system-ui, sans-serif" font-size="8.5" fill="#e0f2fe">Executable Code (SYS_MM_MEM_PERM_EXEC)</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Xtensa literals placed via -mtext-section-literals</text>

      <rect x="235" width="215" height="46" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="247" y="18" font-family="monospace" font-size="10" font-weight="700" fill="#e2e8f0">.rodata</text>
      <text x="247" y="32" font-family="system-ui, sans-serif" font-size="8.5" fill="#cbd5e1">Read-Only Data (SYS_MM_MEM_PERM_RO)</text>
      <text x="247" y="42" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Filter taps, math LUTs, coefficient matrices</text>

      <!-- Row 2: Data & BSS -->
      <rect y="54" width="215" height="46" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="0.8"/>
      <text x="12" y="72" font-family="monospace" font-size="10" font-weight="700" fill="#c4b5fd">.data</text>
      <text x="12" y="86" font-family="system-ui, sans-serif" font-size="8.5" fill="#ede9fe">Initialized Writable Data (RW)</text>
      <text x="12" y="96" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Default states, driver lookup structures</text>

      <rect x="235" y="54" width="215" height="46" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="0.8"/>
      <text x="247" y="72" font-family="monospace" font-size="10" font-weight="700" fill="#c4b5fd">.bss</text>
      <text x="247" y="86" font-family="system-ui, sans-serif" font-size="8.5" fill="#ede9fe">Zero-Initialized Data (Within .data)</text>
      <text x="247" y="96" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Scratch memory, zero-cleared on module load</text>

      <!-- Row 3: SOF Metadata Sections -->
      <rect y="108" width="450" height="54" rx="6" fill="url(#blk-indigo-sys)" stroke="#a855f7" stroke-width="1"/>
      <text x="14" y="126" font-family="monospace" font-size="10" font-weight="700" fill="#f0abfc">.mod_buildinfo</text>
      <text x="125" y="126" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">— SOF_LLEXT_BUILDINFO macro</text>
      <text x="14" y="142" font-family="system-ui, sans-serif" font-size="8.5" fill="#e9d5ff">
        Encodes <tspan font-family="monospace" fill="#38bdf8">struct sof_module_api_build_info</tspan> with ABI version and build tag.
      </text>
      <text x="14" y="154" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">
        Validated during module allocation; prevents loading incompatible binaries.
      </text>

      <!-- Row 4: Hardware Manifest -->
      <rect y="168" width="450" height="46" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="186" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">.module Manifest</text>
      <text x="140" y="186" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">— SOF_LLEXT_MODULE_MANIFEST</text>
      <text x="14" y="202" font-family="system-ui, sans-serif" font-size="8.5" fill="#a7f3d0">
        UUID, entry_point (<tspan font-family="monospace">module_init</tspan>), affinity_mask, load_type (<tspan font-family="monospace">SOF_MAN_MOD_TYPE_LLEXT</tspan>)
      </text>
    </g>
  </g>

  <!-- Central Linking Arrow -->
  <g transform="translate(530, 205)">
    <line x1="5" y1="0" x2="35" y2="0" stroke="#a855f7" stroke-width="2" marker-end="url(#arr-purple-sys)"/>
    <line x1="35" y1="20" x2="5" y2="20" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr-blue-sys)"/>
    <text x="20" y="-8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#c084fc" text-anchor="middle">Dynamic</text>
    <text x="20" y="36" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#93c5fd" text-anchor="middle">Linkage</text>
  </g>

  <!-- Bottom Panel: SOF LLEXT Manager & Memory Orchestration -->
  <g transform="translate(40, 380)" filter="url(#shadow-sys)">
    <rect width="1020" height="235" rx="10" fill="url(#card-grad-sys)" stroke="#059669" stroke-width="1.2"/>
    <rect width="1020" height="28" rx="10" fill="url(#hdr-emerald-sys)"/>
    <rect y="20" width="1020" height="8" fill="#059669"/>
    <text x="20" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      SOF LLEXT Manager Execution &amp; Memory Orchestration Pipeline (llext_manager.c)
    </text>

    <!-- 4 Sub-blocks in Bottom Panel -->
    <!-- Sub-block 1: IPC4 Library Dispatch -->
    <g transform="translate(20, 42)">
      <rect width="230" height="175" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <circle cx="20" cy="20" r="10" fill="#2563eb"/>
      <text x="20" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="38" y="24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#60a5fa">IPC4 Library Dispatch</text>

      <text x="12" y="48" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• <tspan font-family="monospace" fill="#38bdf8">LOAD_LIBRARY_PREPARE</tspan></text>
      <text x="12" y="64" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• <tspan font-family="monospace" fill="#38bdf8">LOAD_LIBRARY</tspan> over DMA</text>
      <text x="12" y="80" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Host transfers signed .ri</text>
      <text x="12" y="96" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Manifest signature verify</text>
      <text x="12" y="112" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Staged in memory buffer</text>
      <text x="12" y="132" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">
        Library context created; module ID mapped to component UUID table.
      </text>
    </g>

    <!-- Sub-block 2: Zephyr LLEXT Loader -->
    <g transform="translate(270, 42)">
      <rect width="230" height="175" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <circle cx="20" cy="20" r="10" fill="#7c3aed"/>
      <text x="20" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="38" y="24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#c084fc">Zephyr LLEXT Loader</text>

      <text x="12" y="48" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Parse ELF headers &amp; shdr</text>
      <text x="12" y="64" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Relocate Xtensa opcodes</text>
      <text x="12" y="80" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Resolve exported symbols</text>
      <text x="12" y="96" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Dependency resolution</text>
      <text x="12" y="112" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Refcount: <tspan font-family="monospace" fill="#a855f7">n_dependent</tspan></text>
      <text x="12" y="132" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">
        Symbol table lookup matches imports against basefw EXPORT_SYMBOL list.
      </text>
    </g>

    <!-- Sub-block 3: Virtual Memory & Permissions -->
    <g transform="translate(520, 42)">
      <rect width="230" height="175" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <circle cx="20" cy="20" r="10" fill="#059669"/>
      <text x="20" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="38" y="24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#34d399">MMU / MPU Security</text>

      <text x="12" y="48" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• <tspan font-family="monospace" fill="#34d399">sys_mm_drv_align_map</tspan></text>
      <text x="12" y="64" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Page size: <tspan font-family="monospace" fill="#34d399">PAGE_SZ (4 KB)</tspan></text>
      <text x="12" y="80" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Copy phase: Map as RW</text>
      <text x="12" y="96" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Exec phase: Update to RX</text>
      <text x="12" y="112" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Read-Only: .rodata locked</text>
      <text x="12" y="132" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">
        Memory domain (k_mem_domain) isolates user-mode algorithms from kernel.
      </text>
    </g>

    <!-- Sub-block 4: Cache & Runtime Binding -->
    <g transform="translate(770, 42)">
      <rect width="230" height="175" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <circle cx="20" cy="20" r="10" fill="#d97706"/>
      <text x="20" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
      <text x="38" y="24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fbbf24">Cache &amp; Instantiation</text>

      <text x="12" y="48" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• <tspan font-family="monospace" fill="#fbbf24">dcache_writeback_region</tspan></text>
      <text x="12" y="64" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• <tspan font-family="monospace" fill="#fbbf24">icache_invalidate_region</tspan></text>
      <text x="12" y="80" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Invoke <tspan font-family="monospace" fill="#38bdf8">entry_point()</tspan></text>
      <text x="12" y="96" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Bind <tspan font-family="monospace" fill="#38bdf8">module_interface</tspan></text>
      <text x="12" y="112" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• DRAM cold store backup</text>
      <text x="12" y="132" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">
        Module adapter hooks into active audio pipeline; processes real-time PCM.
      </text>
    </g>
  </g>
</svg>
