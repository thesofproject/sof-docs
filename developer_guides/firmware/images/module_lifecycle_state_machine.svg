<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- State Card Gradients -->
    <linearGradient id="st-idle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="st-prep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="st-run" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="sm-arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
    <marker id="sm-arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="sm-arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="sm-arr-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="sm-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" rx="12" fill="url(#sm-bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Banner -->
  <g transform="translate(40, 24)">
    <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#f8fafc" letter-spacing="0.3">
      SOF Module Adapter Lifecycle State Machine
    </text>
    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#94a3b8">
      Pipeline Creation, Real-Time Audio Streaming, Parameter Control, and Resource Teardown
    </text>
  </g>

  <!-- ==================== STATE 1: UNINITIALIZED ==================== -->
  <g transform="translate(60, 220)" filter="url(#sm-shadow)">
    <rect width="180" height="130" rx="10" fill="url(#st-idle)" stroke="#64748b" stroke-width="1.5"/>
    <rect width="180" height="34" rx="10" fill="#475569"/>
    <rect y="24" width="180" height="10" fill="#475569"/>
    <text x="90" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">
      UNINITIALIZED
    </text>
    <text x="14" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#cbd5e1">• No heap memory used</text>
    <text x="14" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#cbd5e1">• Component registered</text>
    <text x="14" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#cbd5e1">• Dormant state</text>
    <text x="14" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">Trigger: comp_new()</text>
  </g>

  <!-- Transition Arrow: Uninit -> Prepared -->
  <path d="M 240 265 L 340 265" stroke="#60a5fa" stroke-width="2" marker-end="url(#sm-arr-blue)"/>
  <g transform="translate(248, 230)">
    <rect width="84" height="26" rx="4" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
    <text x="42" y="14" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#93c5fd">init()</text>
    <text x="42" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#60a5fa">[__cold DRAM]</text>
  </g>

  <!-- ==================== STATE 2: PREPARED ==================== -->
  <g transform="translate(350, 180)" filter="url(#sm-shadow)">
    <rect width="220" height="210" rx="10" fill="url(#st-prep)" stroke="#3b82f6" stroke-width="2"/>
    <rect width="220" height="36" rx="10" fill="#1d4ed8"/>
    <rect y="26" width="220" height="10" fill="#1d4ed8"/>
    <text x="110" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      PREPARED / READY
    </text>
    <text x="14" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#bfdbfe">• mod_zalloc() allocated</text>
    <text x="14" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#bfdbfe">• Channels &amp; rate bound</text>
    <text x="14" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#bfdbfe">• Format function linked</text>
    <text x="14" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#bfdbfe">• Delay buffers pre-allocated</text>
    <text x="14" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#93c5fd">  (mod_balloc_align 16B)</text>
    
    <rect x="12" y="146" width="196" height="50" rx="4" fill="#0f172a" stroke="#1e40af" stroke-width="1"/>
    <text x="20" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#60a5fa">Lifecycle Callbacks:</text>
    <text x="20" y="180" font-family="monospace" font-size="9" fill="#e2e8f0">• prepare() (bind kernels)</text>
    <text x="20" y="192" font-family="monospace" font-size="9" fill="#e2e8f0">• reset()   (clear history)</text>
  </g>

  <!-- Transition Arrow: Prepared -> Running -->
  <path d="M 570 265 L 670 265" stroke="#34d399" stroke-width="2.5" marker-end="url(#sm-arr-green)"/>
  <g transform="translate(585, 236)">
    <rect width="70" height="22" rx="4" fill="#0f172a" stroke="#059669" stroke-width="1"/>
    <text x="35" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#6ee7b7">START</text>
  </g>

  <!-- ==================== STATE 3: RUNNING ==================== -->
  <g transform="translate(680, 160)" filter="url(#sm-shadow)">
    <rect width="230" height="250" rx="10" fill="url(#st-run)" stroke="#10b981" stroke-width="2"/>
    <rect width="230" height="36" rx="10" fill="#047857"/>
    <rect y="26" width="230" height="10" fill="#047857"/>
    <text x="115" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      RUNNING (ACTIVE STREAM)
    </text>
    <text x="14" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7">Hard Real-Time Context:</text>
    <text x="14" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#a7f3d0">• Periodic process() loop</text>
    <text x="14" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#a7f3d0">• Tensilica HiFi SIMD kernels</text>
    <text x="14" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#a7f3d0">• Circular ring buffer wrap</text>
    <text x="14" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#a7f3d0">• Zero heap allocations</text>

    <!-- Self Loop: process() -->
    <path d="M 210 160 C 250 160, 250 210, 210 210" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#sm-arr-green)"/>
    <text x="228" y="188" font-family="monospace" font-size="9.5" font-weight="600" fill="#a7f3d0">process()</text>

    <rect x="12" y="152" width="190" height="80" rx="4" fill="#022c22" stroke="#059669" stroke-width="1"/>
    <text x="20" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#34d399">Runtime Controls:</text>
    <text x="20" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#e2e8f0">• set_configuration()</text>
    <text x="20" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#e2e8f0">• get_configuration()</text>
    <text x="20" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#94a3b8">(ALSA amixer &amp; sof-ctl)</text>
  </g>

  <!-- Transition Arrow: Running -> Prepared (STOP / PAUSE) -->
  <path d="M 680 340 C 630 370, 600 370, 570 340" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#sm-arr-amber)"/>
  <g transform="translate(585, 368)">
    <rect width="80" height="22" rx="4" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
    <text x="40" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#fde68a">STOP / reset()</text>
  </g>

  <!-- Transition Arrow: Prepared -> Uninitialized (free) -->
  <path d="M 350 340 C 300 410, 180 410, 150 350" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#sm-arr-rose)"/>
  <g transform="translate(195, 410)">
    <rect width="110" height="26" rx="4" fill="#0f172a" stroke="#dc2626" stroke-width="1"/>
    <text x="55" y="14" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#fca5a5">free()</text>
    <text x="55" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#f87171">[assert_can_be_cold]</text>
  </g>

  <!-- Warning Banner at Bottom -->
  <g transform="translate(60, 480)">
    <rect width="840" height="36" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="16" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#c7d2fe">
      CRITICAL REAL-TIME INVARIANT:
    </text>
    <text x="210" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#e0e7ff">
      Memory allocations and blocking locks are strictly forbidden inside process() to prevent audio glitches and DSP watchdog timeouts.
    </text>
  </g>
</svg>
