<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sched-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="sched-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Domain Headers -->
    <linearGradient id="sched-ll-hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sched-dp-hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="sched-core-hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="sched-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="550" rx="12" fill="url(#sched-bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Banner -->
  <g transform="translate(40, 20)">
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" letter-spacing="0.3">
      Low-Latency (LL) vs. Data Processing (DP) Multi-Period Scheduling
    </text>
    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#94a3b8">
      Matching Buffer Constraints (IBS/OBS), Execution Domains, and Cross-Core Load Balancing
    </text>
  </g>

  <!-- ==================== TIMELINE DIAGRAM ==================== -->
  <g transform="translate(40, 75)" filter="url(#sched-shadow)">
    <rect width="880" height="235" rx="8" fill="url(#sched-card)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Time Axis Header -->
    <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">
      Execution Timeline Across Scheduling Domains (Dual-Rate 48k &amp; 16k Audio Streams)
    </text>

    <!-- 1ms LL Timer Ticks -->
    <g transform="translate(160, 45)">
      <line x1="0" y1="0" x2="680" y2="0" stroke="#475569" stroke-width="1"/>
      <path d="M 0 -4 L 0 4 M 34 -4 L 34 4 M 68 -4 L 68 4 M 102 -4 L 102 4 M 136 -4 L 136 4 M 170 -4 L 170 4 M 204 -4 L 204 4 M 238 -4 L 238 4 M 272 -4 L 272 4 M 306 -4 L 306 4 M 340 -4 L 340 4 M 374 -4 L 374 4 M 408 -4 L 408 4 M 442 -4 L 442 4 M 476 -4 L 476 4 M 510 -4 L 510 4 M 544 -4 L 544 4 M 578 -4 L 578 4 M 612 -4 L 612 4 M 646 -4 L 646 4 M 680 -4 L 680 4" stroke="#64748b" stroke-width="1.5"/>
      <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">0ms</text>
      <text x="170" y="16" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">5ms</text>
      <text x="340" y="16" text-anchor="middle" font-family="monospace" font-size="9" fill="#38bdf8">10ms (DP MWW)</text>
      <text x="510" y="16" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">15ms</text>
      <text x="680" y="16" text-anchor="middle" font-family="monospace" font-size="9" fill="#2dd4bf">20ms (DP ECNS)</text>
    </g>

    <!-- Row 1: Low-Latency Domain (1 ms) -->
    <g transform="translate(20, 80)">
      <rect width="130" height="28" rx="4" fill="#1e3a8a"/>
      <text x="65" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#bfdbfe">LL Domain (1ms)</text>
      
      <!-- 20 small blocks representing 1ms timer ticks -->
      <g transform="translate(140, 4)">
        <rect x="0" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="34" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="68" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="102" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="136" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="170" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="204" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="238" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="272" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="306" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="340" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="374" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="408" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="442" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="476" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="510" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="544" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="578" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="612" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="646" width="8" height="20" rx="2" fill="#3b82f6"/>
        <rect x="680" width="8" height="20" rx="2" fill="#3b82f6"/>
      </g>
      <text x="835" y="18" font-family="monospace" font-size="8.5" fill="#93c5fd">16/48 fr / tick</text>
    </g>

    <!-- Row 2: DP Domain (10 ms = 160 samples for MWW Slots) -->
    <g transform="translate(20, 125)">
      <rect width="130" height="34" rx="4" fill="#0c4a6e"/>
      <text x="65" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#bae6fd">DP 10ms (MWW)</text>
      <text x="65" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#7dd3fc">160 frames / batch</text>

      <g transform="translate(140, 2)">
        <!-- 10ms Batch Period 1 -->
        <rect x="0" width="75" height="30" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
        <text x="37" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#ffffff">Active Burst (2.1ms)</text>
        <text x="37" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#bae6fd">MFCC + TFLM</text>
        <rect x="75" width="265" height="30" rx="3" fill="#0f172a" stroke="#334155" stroke-dasharray="2,2"/>
        <text x="207" y="19" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">Idle / Sleep (7.9ms)</text>

        <!-- 10ms Batch Period 2 -->
        <rect x="340" width="75" height="30" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
        <text x="377" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#ffffff">Active Burst</text>
        <text x="377" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#bae6fd">MFCC + TFLM</text>
        <rect x="415" width="265" height="30" rx="3" fill="#0f172a" stroke="#334155" stroke-dasharray="2,2"/>
        <text x="547" y="19" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">Idle / Sleep (7.9ms)</text>
      </g>
    </g>

    <!-- Row 3: DP Domain (20 ms for Dual-Rate ECNS & KPB) -->
    <g transform="translate(20, 175)">
      <rect width="130" height="34" rx="4" fill="#042f2e"/>
      <text x="65" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#99f6e4">DP 20ms (ECNS)</text>
      <text x="65" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#5eead4">320 (16k) / 960 (48k) fr</text>

      <g transform="translate(140, 2)">
        <!-- 20ms Batch Period -->
        <rect x="0" width="135" height="30" rx="3" fill="#0d9488" stroke="#2dd4bf" stroke-width="1"/>
        <text x="67" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#ffffff">Active AEC &amp; Boost (3.8ms)</text>
        <text x="67" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#ccfbf1">16k In -&gt; 16k Clean / 48k In -&gt; 48k Clean</text>
        <rect x="135" width="545" height="30" rx="3" fill="#0f172a" stroke="#334155" stroke-dasharray="2,2"/>
        <text x="407" y="19" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">Idle / Low-Power Sleep (16.2ms)</text>
      </g>
    </g>
  </g>

  <!-- ==================== THREE SPECIFICATION CARDS AT BOTTOM ==================== -->
  <!-- Card 1: Buffer Sizing Mathematics -->
  <g transform="translate(40, 325)" filter="url(#sched-shadow)">
    <rect width="280" height="205" rx="8" fill="url(#sched-card)" stroke="#14b8a6" stroke-width="1.5"/>
    <rect width="280" height="26" rx="8" fill="url(#sched-dp-hdr)"/>
    <rect y="18" width="280" height="8" fill="url(#sched-dp-hdr)"/>
    <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">
      1. Buffer Sizing Math (IBS / OBS)
    </text>
    <g transform="translate(10, 32)">
      <text x="0" y="12" font-family="monospace" font-size="8.5" fill="#2dd4bf">Size = Rate * (Period / 1000) * CH * B</text>
      <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#94a3b8">• 20ms 16k 2ch S16 (ECNS Pin 0 In):</text>
      <text x="10" y="42" font-family="monospace" font-size="8" fill="#e2e8f0">16000 * 0.02 * 2 * 2 = 1280 B (ibs)</text>
      <text x="0" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#94a3b8">• 20ms 48k 2ch S16 (ECNS Pin 1 In):</text>
      <text x="10" y="70" font-family="monospace" font-size="8" fill="#e2e8f0">48000 * 0.02 * 2 * 2 = 3840 B (ibs)</text>
      <text x="0" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#94a3b8">• 20ms 16k 1ch Clean (to KPB):</text>
      <text x="10" y="98" font-family="monospace" font-size="8" fill="#e2e8f0">16000 * 0.02 * 1 * 2 = 640 B (obs)</text>
      <text x="0" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#94a3b8">• 20ms 48k 2ch Clean (to Host 11):</text>
      <text x="10" y="126" font-family="monospace" font-size="8" fill="#e2e8f0">48000 * 0.02 * 2 * 2 = 3840 B (obs)</text>
      <text x="0" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#94a3b8">• 10ms 16k 1ch MWW Slot Input:</text>
      <text x="10" y="154" font-family="monospace" font-size="8" fill="#e2e8f0">16000 * 0.01 * 1 * 2 = 320 B (ibs)</text>
      <text x="0" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#fca5a5">
        RULE: IBS/OBS must match period exactly!
      </text>
    </g>
  </g>

  <!-- Card 2: Cross-Core Load Balancing -->
  <g transform="translate(340, 325)" filter="url(#sched-shadow)">
    <rect width="280" height="205" rx="8" fill="url(#sched-card)" stroke="#ea580c" stroke-width="1.5"/>
    <rect width="280" height="26" rx="8" fill="url(#sched-core-hdr)"/>
    <rect y="18" width="280" height="8" fill="url(#sched-core-hdr)"/>
    <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">
      2. Multi-Core Affinity Allocation
    </text>
    <g transform="translate(10, 32)">
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#fdba74">Core 0 (Primary DSP Core):</text>
      <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#94a3b8">• P110 (48k) &amp; P119 (16k) DAI Ingest (LL 1ms)</text>
      <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#94a3b8">• P115 Dual-Rate ECNS Processing (DP 20ms)</text>
      <text x="0" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#94a3b8">• P116 KPB 2.0s Pre-roll Ring Buffer (DP 20ms)</text>
      <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#94a3b8">• P111 Slot 0 ("strawberry") Detector (DP 10ms)</text>
      <text x="0" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#94a3b8">• P112 Slot 1 ("Hi Intel") Detector (DP 10ms)</text>
      <text x="0" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#94a3b8">• P114 WOV Arbiter &amp; P117 Host Capture (LL 1ms)</text>
      
      <text x="0" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#fdba74">Core 1 (Secondary DSP Core):</text>
      <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#94a3b8">• P113 Slot 2 ("orange") Detector (DP 10ms)</text>
      <text x="0" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#fed7aa">
        Offloads neural network inference via core_id 1.
      </text>
      <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#cbd5e1">
        Inter-core audio routed locklessly via SRAM mixin.
      </text>
    </g>
  </g>

  <!-- Card 3: Topology LP Mode Directives -->
  <g transform="translate(640, 325)" filter="url(#sched-shadow)">
    <rect width="280" height="205" rx="8" fill="url(#sched-card)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="280" height="26" rx="8" fill="url(#sched-ll-hdr)"/>
    <rect y="18" width="280" height="8" fill="url(#sched-ll-hdr)"/>
    <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">
      3. Topology Class &amp; lp_mode Flags
    </text>
    <g transform="translate(10, 32)">
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#93c5fd">Class.Pipeline."custom-capture":</text>
      <text x="0" y="28" font-family="monospace" font-size="8" fill="#e2e8f0">lp_mode 0  # Low Latency (1ms domain)</text>
      <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#94a3b8">Used for: DAI 110/119, Arbiter 114, Host 117</text>
      
      <text x="0" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#93c5fd">Class.Pipeline."custom-dp-capture":</text>
      <text x="0" y="80" font-family="monospace" font-size="8" fill="#e2e8f0">lp_mode 1  # Data Processing (DP domain)</text>
      <text x="0" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#94a3b8">Used for: ECNS 115 (20ms), KPB 116 (20ms),</text>
      <text x="0" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#94a3b8">MWW Slots 111-113 (10ms domain)</text>

      <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#fde047">
        time_domain "timer"
      </text>
      <text x="0" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#cbd5e1">
        Enables RTOS tick-driven periodic scheduling.
      </text>
      <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#86efac">
        capture_compatible_d0i3: true on PCMs 11 &amp; 12.
      </text>
    </g>
  </g>
</svg>
