<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-line { stroke: #e2e8f0; stroke-width: 1px; stroke-dasharray: 2,2; }
      .axis-line { stroke: #64748b; stroke-width: 1.5px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #64748b; }
      .text-axis { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .curve-lp { stroke: #059669; stroke-width: 2.5px; fill: none; }
      .curve-hp { stroke: #2563eb; stroke-width: 2.5px; fill: none; }
      .curve-sum-lr4 { stroke: #0f172a; stroke-width: 3px; fill: none; }
      .curve-sum-bw { stroke: #dc2626; stroke-width: 2px; stroke-dasharray: 5,4; fill: none; }
      .curve-phase-lp { stroke: #059669; stroke-width: 2px; fill: none; }
      .curve-phase-hp { stroke: #2563eb; stroke-width: 2px; fill: none; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1px; rx: 8px; ry: 8px; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Title & Header -->
  <text x="30" y="32" class="text-title">Linkwitz-Riley LR4 (-24 dB/oct) Acoustic Response &amp; Summation</text>
  <text x="30" y="50" class="text-subtitle">Comparison Against Butterworth 4th-Order (BW4) Showing Magnitude Flatness &amp; Phase Coherence</text>

  <!-- ==================== UPPER PANE: MAGNITUDE RESPONSE ==================== -->
  <g transform="translate(60, 70)">
    <rect width="640" height="260" fill="#ffffff" stroke="#cbd5e1" rx="6" ry="6" />

    <!-- Grid Lines Y (Magnitude dB) -->
    <!-- 0 dB is at y = 60 -->
    <!-- +6 dB at y = 30 -->
    <!-- -6 dB at y = 90 -->
    <!-- -12 dB at y = 120 -->
    <!-- -24 dB at y = 180 -->
    <!-- -36 dB at y = 240 -->
    <line x1="50" y1="30" x2="620" y2="30" class="grid-line" />
    <text x="42" y="34" class="text-axis" text-anchor="end">+6 dB</text>

    <line x1="50" y1="60" x2="620" y2="60" stroke="#94a3b8" stroke-width="1.5px" />
    <text x="42" y="64" class="text-axis" text-anchor="end" font-weight="700">0 dB</text>

    <line x1="50" y1="90" x2="620" y2="90" stroke="#fca5a5" stroke-width="1px" stroke-dasharray="3,3" />
    <text x="42" y="94" class="text-axis" text-anchor="end" fill="#dc2626" font-weight="600">-6 dB</text>

    <line x1="50" y1="120" x2="620" y2="120" class="grid-line" />
    <text x="42" y="124" class="text-axis" text-anchor="end">-12 dB</text>

    <line x1="50" y1="180" x2="620" y2="180" class="grid-line" />
    <text x="42" y="184" class="text-axis" text-anchor="end">-24 dB</text>

    <line x1="50" y1="240" x2="620" y2="240" class="grid-line" />
    <text x="42" y="244" class="text-axis" text-anchor="end">-36 dB</text>

    <!-- Grid Lines X (Log Frequency) -->
    <!-- Fc is at x = 335 (Center) -->
    <line x1="120" y1="20" x2="120" y2="245" class="grid-line" />
    <text x="120" y="255" class="text-axis" text-anchor="middle">0.1 Fc</text>

    <line x1="225" y1="20" x2="225" y2="245" class="grid-line" />
    <text x="225" y="255" class="text-axis" text-anchor="middle">0.5 Fc</text>

    <line x1="335" y1="20" x2="335" y2="245" stroke="#dc2626" stroke-width="1px" stroke-dasharray="4,3" />
    <text x="335" y="255" class="text-axis" text-anchor="middle" font-weight="700" fill="#dc2626">Fc (Crossover)</text>

    <line x1="445" y1="20" x2="445" y2="245" class="grid-line" />
    <text x="445" y="255" class="text-axis" text-anchor="middle">2 Fc</text>

    <line x1="550" y1="20" x2="550" y2="245" class="grid-line" />
    <text x="550" y="255" class="text-axis" text-anchor="middle">10 Fc</text>

    <!-- CURVES -->
    <!-- Low-Pass LR4 Curve (Green): Flat at 0dB, -6dB at x=335, dropping steeply at -24dB/oct -->
    <path d="M 50 60 L 190 60 C 250 60 290 65 335 90 C 370 115 410 170 480 250" class="curve-lp" />
    
    <!-- High-Pass LR4 Curve (Blue): Rising steeply at +24dB/oct, -6dB at x=335, flat at 0dB -->
    <path d="M 190 250 C 260 170 300 115 335 90 C 380 65 420 60 620 60" class="curve-hp" />

    <!-- Butterworth 4th-order sum curve (Red dashed): +3dB peak at Fc (y=45) -->
    <path d="M 50 60 L 220 60 C 270 60 300 45 335 45 C 370 45 400 60 450 60 L 620 60" class="curve-sum-bw" />

    <!-- Linkwitz-Riley Sum curve (Black solid): EXACT 0 dB flat line across full spectrum! -->
    <path d="M 50 60 L 620 60" class="curve-sum-lr4" />

    <!-- Fc intersection dot -->
    <circle cx="335" cy="90" r="4.5" fill="#dc2626" />
    <text x="345" y="93" class="text-label" fill="#dc2626" font-size="11">-6.02 dB</text>

    <circle cx="335" cy="45" r="4" fill="#dc2626" />
    <text x="345" y="43" class="text-label" fill="#dc2626" font-size="10">+3 dB (BW4 Peak)</text>

    <!-- Pane Title -->
    <text x="60" y="25" class="text-label" fill="#0f172a">A. Frequency Magnitude Response (dB)</text>
  </g>

  <!-- ==================== LOWER PANE: PHASE RESPONSE ==================== -->
  <g transform="translate(60, 360)">
    <rect width="640" height="240" fill="#ffffff" stroke="#cbd5e1" rx="6" ry="6" />

    <!-- Grid Lines Y (Phase degrees) -->
    <!-- 0 deg at y = 120 -->
    <!-- +180 deg at y = 50 -->
    <!-- -180 deg at y = 190 -->
    <line x1="50" y1="50" x2="620" y2="50" class="grid-line" />
    <text x="42" y="54" class="text-axis" text-anchor="end">+180°</text>

    <line x1="50" y1="120" x2="620" y2="120" stroke="#94a3b8" stroke-width="1.5px" />
    <text x="42" y="124" class="text-axis" text-anchor="end" font-weight="700">0°</text>

    <line x1="50" y1="190" x2="620" y2="190" class="grid-line" />
    <text x="42" y="194" class="text-axis" text-anchor="end">-180°</text>

    <!-- Grid Lines X -->
    <line x1="120" y1="20" x2="120" y2="225" class="grid-line" />
    <line x1="225" y1="20" x2="225" y2="225" class="grid-line" />
    <line x1="335" y1="20" x2="335" y2="225" stroke="#dc2626" stroke-width="1px" stroke-dasharray="4,3" />
    <line x1="445" y1="20" x2="445" y2="225" class="grid-line" />
    <line x1="550" y1="20" x2="550" y2="225" class="grid-line" />

    <!-- Phase Curves -->
    <!-- Low pass phase: rotates from 0 deg (y=120) down to -180 deg at Fc (y=190) -->
    <path d="M 50 120 C 180 120 260 150 335 190 C 400 215 480 225 620 225" class="curve-phase-lp" />

    <!-- High pass phase: rotates from +180 deg (y=50) down through 0 deg at Fc (or wrapping at identical phase) -->
    <!-- High pass wrapped phase: identically passes through -180 deg (or 0 deg relative) -->
    <path d="M 50 20 C 180 30 260 90 335 190 C 400 215 480 225 620 225" class="curve-phase-hp" stroke-dasharray="4,3" />

    <circle cx="335" cy="190" r="4.5" fill="#0284c7" />
    <text x="345" y="188" class="text-label" fill="#0284c7" font-size="11">Δφ = 0° (In-Phase Coherence)</text>

    <!-- Pane Title -->
    <text x="60" y="25" class="text-label" fill="#0f172a">B. Unwrapped Acoustic Phase Shift (Degrees)</text>
    <text x="60" y="232" class="text-axis" fill="#64748b">Low-pass and High-pass outputs have zero phase difference at Fc (zero acoustic lobe tilt)</text>
  </g>

  <!-- ==================== SIDEBAR CARDS ==================== -->
  <g transform="translate(720, 70)">
    <!-- Legend Card -->
    <rect width="250" height="150" class="card" />
    <text x="15" y="24" class="text-title" font-size="13">Legend &amp; Curves</text>
    
    <line x1="15" y1="45" x2="45" y2="45" class="curve-sum-lr4" stroke-width="2.5px" />
    <text x="55" y="49" class="text-body" font-size="11" font-weight="600">LR4 Acoustic Sum (0 dB Flat)</text>

    <line x1="15" y1="70" x2="45" y2="70" class="curve-lp" />
    <text x="55" y="74" class="text-body" font-size="11">LR4 Low-Pass (-24 dB/oct)</text>

    <line x1="15" y1="95" x2="45" y2="95" class="curve-hp" />
    <text x="55" y="99" class="text-body" font-size="11">LR4 High-Pass (+24 dB/oct)</text>

    <line x1="15" y1="120" x2="45" y2="120" class="curve-sum-bw" />
    <text x="55" y="124" class="text-body" font-size="11" fill="#dc2626">Butterworth 4 (+3 dB Peak)</text>

    <!-- Acoustic Advantages Card -->
    <rect y="170" width="250" height="230" class="card" />
    <text x="15" y="194" class="text-title" font-size="13">Why LR4 in SOF?</text>

    <text x="15" y="220" class="text-body" font-weight="600" fill="#065f46">1. Zero Peaking:</text>
    <text x="15" y="236" class="text-body" font-size="11">Summed output magnitude</text>
    <text x="15" y="250" class="text-body" font-size="11">is exactly 1.0 (0.00 dB ripple).</text>

    <text x="15" y="274" class="text-body" font-weight="600" fill="#0369a1">2. Phase Coherence:</text>
    <text x="15" y="290" class="text-body" font-size="11">Outputs are 360° (0°) in phase;</text>
    <text x="15" y="304" class="text-body" font-size="11">lobing points on-axis.</text>

    <text x="15" y="328" class="text-body" font-weight="600" fill="#b45309">3. Steep Attenuation:</text>
    <text x="15" y="344" class="text-body" font-size="11">24 dB/oct roll-off protects</text>
    <text x="15" y="358" class="text-body" font-size="11">tweeters from bass excursions.</text>

    <!-- Mathematical Formula Card -->
    <rect y="420" width="250" height="110" class="card" fill="#f1f5f9" />
    <text x="15" y="442" class="text-title" font-size="12" fill="#334155">Transfer Function:</text>
    <text x="15" y="465" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">H_LR4(s) = [H_BW2(s)]²</text>
    <text x="15" y="485" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">|H_LP(jωc)| = 0.5 (-6.02 dB)</text>
    <text x="15" y="505" font-family="ui-monospace, monospace" font-size="10" fill="#059669">|H_LP|² + |H_HP|² = 1.00</text>
  </g>
</svg>
