<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" fill="url(#bgGrad2)"/>
  <rect x="15" y="15" width="1170" height="610" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 35)">
    <text x="0" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">Triangular Mel Filterbank &amp; Slaney Normalization Architecture</text>
    <text x="0" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Non-Linear Frequency Warping, Critical Band Triangular Spacing, Slaney Energy Area Balance, and Sparse Packed Storage</text>
  </g>

  <!-- Top Chart: Mel Scale Mapping Function -->
  <g transform="translate(40, 95)" filter="url(#shadow2)">
    <rect width="1120" height="135" rx="8" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">PSYCHOACOUSTIC FREQUENCY WARPING: MEL SCALE VS LINEAR HZ</text>
    <text x="1100" y="24" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">m = 2595 · log₁₀(1 + f / 700) = 1127 · ln(1 + f / 700)</text>

    <!-- Curve Area -->
    <g transform="translate(60, 35)">
      <!-- Axis Lines -->
      <line x1="0" y1="80" x2="1000" y2="80" stroke="#475569" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="80" stroke="#475569" stroke-width="1.5"/>

      <!-- Frequency Ticks (Linear Scale along X) -->
      <!-- 0 Hz = 0px, 1000 Hz = 200px, 2000 Hz = 380px, 4000 Hz = 660px, 8000 Hz = 980px -->
      <line x1="0" y1="80" x2="0" y2="85" stroke="#94a3b8" stroke-width="1"/>
      <text x="0" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">0 Hz</text>

      <line x1="160" y1="80" x2="160" y2="85" stroke="#94a3b8" stroke-width="1"/>
      <text x="160" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">1000 Hz</text>

      <line x1="340" y1="80" x2="340" y2="85" stroke="#94a3b8" stroke-width="1"/>
      <text x="340" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">2000 Hz</text>

      <line x1="560" y1="80" x2="560" y2="85" stroke="#94a3b8" stroke-width="1"/>
      <text x="560" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">4000 Hz</text>

      <line x1="980" y1="80" x2="980" y2="85" stroke="#94a3b8" stroke-width="1"/>
      <text x="980" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">8000 Hz (Nyquist)</text>

      <!-- Mel Ticks along Y (80px is 0 Mel, 10px is 2840 Mel) -->
      <line x1="-5" y1="80" x2="0" y2="80" stroke="#94a3b8" stroke-width="1"/>
      <text x="-10" y="83" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">0 Mel</text>

      <line x1="-5" y1="52" x2="0" y2="52" stroke="#94a3b8" stroke-width="1"/>
      <text x="-10" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">1000 Mel</text>

      <line x1="-5" y1="12" x2="0" y2="12" stroke="#94a3b8" stroke-width="1"/>
      <text x="-10" y="15" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">2840 Mel</text>

      <!-- Grid Line at 1000 Hz transition -->
      <line x1="160" y1="0" x2="160" y2="80" stroke="#334155" stroke-dasharray="3,3" stroke-width="1"/>
      <text x="165" y="15" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Linear Domain (f &lt; 1 kHz)</text>
      <text x="400" y="15" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Logarithmic Compression Domain (f &gt; 1 kHz)</text>

      <!-- Warping Curve: 0,80 -> 160,52 -> 340,36 -> 560,24 -> 980,12 -->
      <path d="M 0 80 Q 80 66 160 52 T 340 36 T 560 24 T 980 12" fill="none" stroke="url(#curveGrad)" stroke-width="3"/>
      <circle cx="160" cy="52" r="4" fill="#38bdf8"/>
      <circle cx="980" cy="12" r="4" fill="#c084fc"/>
    </g>
  </g>

  <!-- Middle Chart: Triangular Filterbank Frequency Response -->
  <g transform="translate(40, 245)" filter="url(#shadow2)">
    <rect width="1120" height="230" rx="8" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" fill="#a855f7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">TRIANGULAR MEL FILTERBANK: SLANEY AREA NORMALIZATION VS CONSTANT HEIGHT</text>

    <!-- Legend in Top Right -->
    <g transform="translate(750, 12)">
      <line x1="0" y1="10" x2="25" y2="10" stroke="#38bdf8" stroke-width="2"/>
      <text x="32" y="14" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Slaney Area-Normalized (Height = 2 / Δf)</text>
      <line x1="230" y1="10" x2="255" y2="10" stroke="#f43f5e" stroke-dasharray="3,3" stroke-width="1.5"/>
      <text x="262" y="14" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Unnormalized (Height = 1.0)</text>
    </g>

    <!-- Filterbank Graph -->
    <g transform="translate(60, 45)">
      <!-- Baseline Axis -->
      <line x1="0" y1="140" x2="1000" y2="140" stroke="#475569" stroke-width="1.5"/>
      <line x1="0" y1="10" x2="0" y2="140" stroke="#475569" stroke-width="1.5"/>

      <!-- Ticks along X -->
      <line x1="0" y1="140" x2="0" y2="145" stroke="#94a3b8" stroke-width="1"/>
      <text x="0" y="157" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">20 Hz (f_low)</text>

      <line x1="160" y1="140" x2="160" y2="145" stroke="#94a3b8" stroke-width="1"/>
      <text x="160" y="157" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">1000 Hz</text>

      <line x1="340" y1="140" x2="340" y2="145" stroke="#94a3b8" stroke-width="1"/>
      <text x="340" y="157" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">2000 Hz</text>

      <line x1="560" y1="140" x2="560" y2="145" stroke="#94a3b8" stroke-width="1"/>
      <text x="560" y="157" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">4000 Hz</text>

      <line x1="980" y1="140" x2="980" y2="145" stroke="#94a3b8" stroke-width="1"/>
      <text x="980" y="157" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">8000 Hz (f_high)</text>

      <!-- Triangular Filter Shapes: Slaney Normalized (Height decreases as bandwidth expands) -->
      <!-- Low Freq Bands (Narrow bandwidth, tall height) -->
      <!-- Band 1: 0 to 24, peak at 12 -->
      <polygon points="0,140 12,20 24,140" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Band 2: 12 to 38, peak at 25 -->
      <polygon points="12,140 25,20 38,140" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Band 3: 25 to 54, peak at 39 -->
      <polygon points="25,140 39,20 54,140" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Band 4: 39 to 72, peak at 55 -->
      <polygon points="39,140 55,20 72,140" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Band 5: 55 to 94, peak at 74 -->
      <polygon points="55,140 74,22 94,140" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Band 6: 74 to 120, peak at 96 -->
      <polygon points="74,140 96,25 120,140" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Band 7: 96 to 150, peak at 122 -->
      <polygon points="96,140 122,28 150,140" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Band 8: 122 to 186, peak at 153 -->
      <polygon points="122,140 153,32 186,140" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>

      <!-- Mid Freq Bands (Widening, height scaling down) -->
      <!-- Band 9: 153 to 230, peak at 190 -->
      <polygon points="153,140 190,40 230,140" fill="#7c3aed" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.5"/>
      <!-- Band 10: 190 to 286, peak at 235 -->
      <polygon points="190,140 235,50 286,140" fill="#7c3aed" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.5"/>
      <!-- Band 11: 235 to 354, peak at 292 -->
      <polygon points="235,140 292,62 354,140" fill="#7c3aed" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.5"/>
      <!-- Band 12: 292 to 438, peak at 362 -->
      <polygon points="292,140 362,75 438,140" fill="#7c3aed" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.5"/>

      <!-- High Freq Bands (Very wide, low height) -->
      <!-- Band 13: 362 to 542, peak at 448 -->
      <polygon points="362,140 448,88 542,140" fill="#db2777" fill-opacity="0.25" stroke="#ec4899" stroke-width="1.5"/>
      <!-- Band 14: 448 to 670, peak at 554 -->
      <polygon points="448,140 554,100 670,140" fill="#db2777" fill-opacity="0.25" stroke="#ec4899" stroke-width="1.5"/>
      <!-- Band 15: 554 to 828, peak at 686 -->
      <polygon points="554,140 686,110 828,140" fill="#db2777" fill-opacity="0.25" stroke="#ec4899" stroke-width="1.5"/>
      <!-- Band 16: 686 to 1000, peak at 850 -->
      <polygon points="686,140 850,118 1000,140" fill="#db2777" fill-opacity="0.25" stroke="#ec4899" stroke-width="1.5"/>

      <!-- Unnormalized Dashed Overlays on High Freq -->
      <path d="M 362 140 L 448 20 L 542 140" fill="none" stroke="#f43f5e" stroke-dasharray="3,3" stroke-width="1.5"/>
      <path d="M 448 140 L 554 20 L 670 140" fill="none" stroke="#f43f5e" stroke-dasharray="3,3" stroke-width="1.5"/>
      <path d="M 554 140 L 686 20 L 828 140" fill="none" stroke="#f43f5e" stroke-dasharray="3,3" stroke-width="1.5"/>
      <path d="M 686 140 L 850 20 L 1000 140" fill="none" stroke="#f43f5e" stroke-dasharray="3,3" stroke-width="1.5"/>

      <!-- Annotations -->
      <text x="35" y="10" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Narrow Bands: Dense formants (F0, F1)</text>
      <text x="680" y="80" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Wide Bands: Energy normalized to prevent HF blowout</text>
    </g>
  </g>

  <!-- Bottom Section: Memory Layout Optimization: Dense vs Packed -->
  <g transform="translate(40, 490)" filter="url(#shadow2)">
    <rect width="1120" height="115" rx="8" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SOF EMBEDDED DSP OPTIMIZATION: SPARSE TRIANGULAR FILTER PACKING</text>

    <!-- Dense Representation Card -->
    <g transform="translate(20, 35)">
      <rect width="450" height="65" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
      <text x="15" y="20" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Traditional Dense Matrix Storage (Wasteful)</text>
      <text x="15" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Size = (N_fft/2 + 1) × M_mel = 257 × 80 = 20,560 words (41.1 KB)</text>
      <text x="15" y="54" fill="#f87171" font-family="system-ui, sans-serif" font-size="10">94.2% of matrix entries are zero! Wastes critical DSP SRAM.</text>
    </g>

    <!-- Arrow / Reduction Indicator -->
    <g transform="translate(485, 52)">
      <text x="30" y="18" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="700">95% RAM Reduction ➔</text>
    </g>

    <!-- Packed Sparse Card -->
    <g transform="translate(680, 35)">
      <rect width="420" height="65" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="20" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SOF Packed Vector Storage (struct psy_mel_filterbank)</text>
      <text x="15" y="38" fill="#38bdf8" font-family="monospace" font-size="10">[next_triangle_idx, start_fft_bin, length, weight₀..weightₖ]</text>
      <text x="15" y="54" fill="#34d399" font-family="system-ui, sans-serif" font-size="10">Total footprint: ~1,850 int16_t words (3.7 KB). Zero-overhead inner loop.</text>
    </g>
  </g>
</svg>
