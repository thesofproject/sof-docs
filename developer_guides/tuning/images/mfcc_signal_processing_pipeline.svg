<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  <rect x="15" y="15" width="1170" height="670" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 35)">
    <text x="0" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">MFCC Audio Feature Extraction Pipeline Architecture</text>
    <text x="0" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">End-to-End SOF Fixed-Point DSP Engine: Pre-Emphasis, Overlap Framing, FFT, Mel Filterbank, Dual-Mode Mel/DCT, and Embedded VAD/DTX</text>
  </g>

  <!-- Main Top Signal Chain: Audio Ingress to Log Mel -->
  <g transform="translate(40, 95)">
    <!-- Stage 0: Audio Ingress -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="135" height="110" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="0" y="0" width="135" height="24" rx="8" fill="#0284c7" fill-opacity="0.3"/>
      <text x="67" y="16" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">AUDIO INGRESS</text>
      <text x="67" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">PCM Audio In</text>
      <text x="67" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">S16 / S24 / S32</text>
      <text x="67" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Mono / Selected Ch</text>
      <text x="67" y="96" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">fs = 16000 Hz</text>
    </g>

    <!-- Connector 0 -> 1 -->
    <path d="M 135 55 L 165 55" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 1: Pre-Emphasis -->
    <g transform="translate(170, 0)" filter="url(#shadow)">
      <rect width="145" height="110" rx="8" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5"/>
      <rect x="0" y="0" width="145" height="24" rx="8" fill="#0891b2" fill-opacity="0.3"/>
      <text x="72" y="16" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STAGE 1: PRE-EMPHASIS</text>
      <text x="72" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">1st-Order Highpass</text>
      <text x="72" y="62" fill="#38bdf8" font-family="monospace" font-size="10.5" text-anchor="middle">y[n] = x[n] - α·x[n-1]</text>
      <text x="72" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">α = 0.97 (Q1.15 = 31785)</text>
      <text x="72" y="96" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">+6 dB/oct Spectral Tilt</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <path d="M 315 55 L 345 55" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 2: Framing & Windowing -->
    <g transform="translate(350, 0)" filter="url(#shadow)">
      <rect width="165" height="110" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="0" y="0" width="165" height="24" rx="8" fill="#2563eb" fill-opacity="0.3"/>
      <text x="82" y="16" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STAGE 2: FRAMING &amp; WIN</text>
      <text x="82" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Sliding Window</text>
      <text x="82" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Frame: 25 ms (400 smp)</text>
      <text x="82" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Shift: 10 ms (160 smp)</text>
      <text x="82" y="96" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Hamming / Hann / Povey</text>
    </g>

    <!-- Connector 2 -> 3 -->
    <path d="M 515 55 L 545 55" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 3: FFT & Power Spectrum -->
    <g transform="translate(550, 0)" filter="url(#shadow)">
      <rect width="165" height="110" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5"/>
      <rect x="0" y="0" width="165" height="24" rx="8" fill="#4f46e5" fill-opacity="0.3"/>
      <text x="82" y="16" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STAGE 3: FFT &amp; POWER</text>
      <text x="82" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">512-point Real FFT</text>
      <text x="82" y="62" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">P[k] = Re[k]² + Im[k]²</text>
      <text x="82" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">257 unique freq bins</text>
      <text x="82" y="96" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Δf = 16000/512 = 31.25 Hz</text>
    </g>

    <!-- Connector 3 -> 4 -->
    <path d="M 715 55 L 745 55" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 4: Mel Filterbank -->
    <g transform="translate(750, 0)" filter="url(#shadow)">
      <rect width="170" height="110" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
      <rect x="0" y="0" width="170" height="24" rx="8" fill="#7e22ce" fill-opacity="0.3"/>
      <text x="85" y="16" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STAGE 4: MEL FILTERBANK</text>
      <text x="85" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Triangular Filterbank</text>
      <text x="85" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">M = 23 (MFCC) or 80 (Mel)</text>
      <text x="85" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">20 Hz to 8000 Hz (Nyquist)</text>
      <text x="85" y="96" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Slaney Area Normalized</text>
    </g>

    <!-- Connector 4 -> 5 -->
    <path d="M 920 55 L 950 55" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 5: Logarithmic Compression -->
    <g transform="translate(955, 0)" filter="url(#shadow)">
      <rect width="165" height="110" rx="8" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5"/>
      <rect x="0" y="0" width="165" height="24" rx="8" fill="#be185d" fill-opacity="0.3"/>
      <text x="82" y="16" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STAGE 5: LOG COMPRESSION</text>
      <text x="82" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Perceptual Energy</text>
      <text x="82" y="62" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">E_log = ln(E_m + p_min)</text>
      <text x="82" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">p_min = 1e-10 (Floor)</text>
      <text x="82" y="96" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Fixed-Point Q9.23 Format</text>
    </g>
  </g>

  <!-- Branching Decision Node: Stage 5 to Dual Paths -->
  <g transform="translate(40, 235)">
    <!-- Branch Fork Point from Log Compression (x=1037 in parent coords) -->
    <path d="M 1037 0 L 1037 35 L 560 35" stroke="#ec4899" stroke-width="2" fill="none"/>
    <circle cx="1037" cy="0" r="4" fill="#ec4899"/>
    <circle cx="560" cy="35" r="4" fill="#ec4899"/>

    <!-- Branch Left: Path A (Mel Spectrogram Mode, num_ceps == 0) -->
    <path d="M 560 35 L 260 35 L 260 65" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
    <text x="350" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Path A: Mel-Only Mode (num_ceps = 0, e.g. 80 bins)</text>

    <!-- Branch Right: Path B (MFCC Cepstral Mode, num_ceps > 0) -->
    <path d="M 560 35 L 860 35 L 860 65" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>
    <text x="640" y="28" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Path B: MFCC Cepstral Mode (num_ceps = 13..40)</text>

    <!-- Path A Card: Whisper / ASR Mel Post-Processing -->
    <g transform="translate(50, 70)" filter="url(#shadow)">
      <rect width="420" height="155" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="0" y="0" width="420" height="28" rx="10" fill="#047857" fill-opacity="0.3"/>
      <text x="15" y="19" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">MODE A: WHISPER-COMPATIBLE MEL SPECTROGRAM (80 Bins)</text>

      <g transform="translate(15, 38)">
        <text x="0" y="16" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">1. Dynamic Peak Tracking:</text>
        <text x="175" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">mmax decay with coeff mmax_coef (Q1.15)</text>

        <text x="0" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">2. Headroom Clamp:</text>
        <text x="175" y="36" fill="#38bdf8" font-family="monospace" font-size="11">clamp(E_mel, mmax - top_db, mmax)</text>

        <text x="0" y="56" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">3. Scale &amp; Offset:</text>
        <text x="175" y="56" fill="#38bdf8" font-family="monospace" font-size="11">Out = (E_mel + mel_offset) × mel_scale</text>

        <text x="0" y="76" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">4. Whisper Setpoint:</text>
        <text x="175" y="76" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">mel_offset = 4.0, mel_scale = 0.25 (Q4.12)</text>

        <rect x="0" y="88" width="390" height="26" rx="5" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1"/>
        <text x="195" y="105" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Direct Input to OpenAI Whisper &amp; End-to-End Neural Networks</text>
      </g>
    </g>

    <!-- Path B Card: Classical MFCC Cepstral Coefficients -->
    <g transform="translate(650, 70)" filter="url(#shadow)">
      <rect width="420" height="155" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
      <rect x="0" y="0" width="420" height="28" rx="10" fill="#6b21a8" fill-opacity="0.3"/>
      <text x="15" y="19" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">MODE B: CEPSTRAL COEFFICIENT ENGINE (13 Coefficients)</text>

      <g transform="translate(15, 38)">
        <text x="0" y="16" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">1. Q-Format Conversion:</text>
        <text x="165" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Truncate Q9.23 to Q9.7 16-bit integers</text>

        <text x="0" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">2. 16-bit DCT-II Matrix:</text>
        <text x="165" y="36" fill="#38bdf8" font-family="monospace" font-size="11">c_n = Σ_m E_m · cos(π n (m + 0.5) / M)</text>

        <text x="0" y="56" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">3. Cepstral Liftering:</text>
        <text x="165" y="56" fill="#38bdf8" font-family="monospace" font-size="11">w_n = 1 + (L/2)·sin(π·n / L), L = 22.0</text>

        <text x="0" y="76" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">4. Variance Equalization:</text>
        <text x="165" y="76" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11">Balances high/low order cepstral noise</text>

        <rect x="0" y="88" width="390" height="26" rx="5" fill="#3b0764" fill-opacity="0.4" stroke="#9333ea" stroke-width="1"/>
        <text x="195" y="105" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Input Tensor to TensorFlow Lite Micro &amp; microWakeWord</text>
      </g>
    </g>
  </g>

  <!-- Bottom Section: Embedded VAD, Frame Header & DTX Engine -->
  <g transform="translate(40, 480)" filter="url(#shadow)">
    <rect width="1120" height="180" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="1120" height="28" rx="10" fill="#b45309" fill-opacity="0.3"/>
    <text x="20" y="19" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">INTEGRATED ENERGY SUBSYSTEM: VOICE ACTIVITY DETECTION (VAD) &amp; DISCONTINUOUS TRANSMISSION (DTX)</text>

    <!-- 3 Sub-Blocks in VAD Section -->
    <!-- Sub-Block 1: A-Weighted Energy & Tracking -->
    <g transform="translate(20, 38)">
      <rect width="345" height="128" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="20" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">1. A-Weighted Noise Floor Tracking</text>
      <text x="15" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• IEC 61672-1:2013 A-weighting interpolated</text>
      <text x="15" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• Weights w_i in Q1.15, peak normalized at 2.5 kHz</text>
      <text x="15" y="76" fill="#38bdf8" font-family="monospace" font-size="10">Floor[i] = instant drop, slow α rise</text>
      <text x="15" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• α_fast = 0.020 (init 1s), α_slow = 0.003 (Q1.15 = 98)</text>
      <text x="15" y="114" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Adaptive background acoustic tracking</text>
    </g>

    <!-- Sub-Block 2: Speech Decision & Hangover -->
    <g transform="translate(385, 38)">
      <rect width="345" height="128" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="20" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">2. Speech Detection &amp; Hangover</text>
      <text x="15" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• Signal Energy: E_sig = Σ w_i · Mel[i] (Q9.23)</text>
      <text x="15" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• Noise Energy: E_noise = Σ w_i · Floor[i] (Q9.23)</text>
      <text x="15" y="76" fill="#38bdf8" font-family="monospace" font-size="10">ΔE = E_sig - E_noise &gt; 0.30 (Q9.23 = 2516582)</text>
      <text x="15" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• Hangover = 20 hops (200 ms) speech bridge</text>
      <text x="15" y="114" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Eliminates speech clipping &amp; chatter</text>
    </g>

    <!-- Sub-Block 3: DTX Suppression & Frame Header -->
    <g transform="translate(750, 38)">
      <rect width="350" height="128" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="20" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">3. DTX Protocol &amp; struct mfcc_data_header</text>
      <text x="15" y="40" fill="#38bdf8" font-family="monospace" font-size="9.5">struct { magic=0x6d666363, frame_num,</text>
      <text x="15" y="55" fill="#38bdf8" font-family="monospace" font-size="9.5">         energy, noise_energy, vad_flag };</text>
      <text x="15" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• Prepend 24-byte header before features</text>
      <text x="15" y="92" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• DTX silences frames when vad=0 (trailing: 20)</text>
      <text x="15" y="114" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="10" font-weight="600">&gt; 80% Host Bus &amp; Memory Bandwidth Savings</text>
    </g>
  </g>
</svg>
