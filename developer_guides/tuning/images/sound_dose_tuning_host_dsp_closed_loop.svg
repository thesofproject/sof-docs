<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="dspGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="hostGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="uiGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1000" height="620" rx="14" fill="url(#bgGrad5)" stroke="#334155" stroke-width="1.5" />

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
    Host-DSP Closed-Loop Sound Dose Architecture &amp; Regulation
  </text>
  <text x="500" y="60" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    Asynchronous IPC4 Notification Dispatch, 7-Day Rolling CSD Tracking, and Smooth Protective Attenuation
  </text>

  <!-- Left Column: SOF Firmware DSP Subsystem -->
  <g transform="translate(40, 85)" filter="url(#shadow5)">
    <rect width="360" height="500" rx="10" fill="url(#dspGrad5)" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="0" y="0" width="360" height="38" rx="10" fill="#1d4ed8" />
    <rect x="0" y="28" width="360" height="10" fill="#1d4ed8" />
    <text x="180" y="25" text-anchor="middle" fill="#eff6ff" font-family="sans-serif" font-size="13.5" font-weight="700">
      SOF FIRMWARE DSP DOMAIN
    </text>

    <!-- DSP Internal blocks -->
    <!-- Audio Pipeline -->
    <g transform="translate(20, 55)">
      <rect width="320" height="75" rx="6" fill="#0f172a" stroke="#38bdf8" />
      <text x="160" y="22" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="11.5" font-weight="700">Real-Time Audio Pipeline</text>
      <text x="15" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">Input PCM → Slew Gain Mult → Sink PCM</text>
      <text x="15" y="60" fill="#a7f3d0" font-family="monospace" font-size="10">cd-&gt;gain: ±0.05 dB/frame slew rate</text>
    </g>

    <!-- Energy Accumulator & Filter -->
    <g transform="translate(20, 142)">
      <rect width="320" height="85" rx="6" fill="#0f172a" stroke="#818cf8" />
      <text x="160" y="22" text-anchor="middle" fill="#a5b4fc" font-family="sans-serif" font-size="11.5" font-weight="700">IEC 61672 Class 1 A-Weighting Core</text>
      <text x="15" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Cascaded DF1 Biquads (48k / 44.1k)</text>
      <text x="15" y="58" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• 64-bit energy accumulator: <tspan fill="#fde68a" font-family="monospace">cd-&gt;energy[ch]</tspan></text>
      <text x="15" y="74" fill="#6ee7b7" font-family="sans-serif" font-size="10">• 1-second periodic tick (48,000 frames)</text>
    </g>

    <!-- Log2 Engine & MEL Derivation -->
    <g transform="translate(20, 239)">
      <rect width="320" height="85" rx="6" fill="#0f172a" stroke="#a855f7" />
      <text x="160" y="22" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="11.5" font-weight="700">Integer Log2 &amp; MEL Calculator</text>
      <text x="15" y="42" fill="#f8fafc" font-family="monospace" font-size="10.5">MEL = dbfs + sens_dbfs + vol_offset</text>
      <text x="15" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Precision: Centi-decibels (0.01 dB)</text>
      <text x="15" y="74" fill="#e2e8f0" font-family="sans-serif" font-size="10">• 96-bit microsecond clock latching</text>
    </g>

    <!-- Asynchronous IPC Notification Dispatcher -->
    <g transform="translate(20, 336)">
      <rect width="320" height="135" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="160" y="24" text-anchor="middle" fill="#a5b4fc" font-family="sans-serif" font-size="11.5" font-weight="700">Asynchronous IPC4 Dispatcher</text>
      <text x="15" y="46" fill="#f8fafc" font-family="monospace" font-size="10">SOF_IPC4_GLB_NOTIFICATION</text>
      <text x="15" y="62" fill="#cbd5e1" font-family="sans-serif" font-size="10">Event: 0xCA (Bytes Control ID 3)</text>
      <line x1="15" y1="72" x2="305" y2="72" stroke="#4338ca" />
      <text x="15" y="88" fill="#93c5fd" font-family="sans-serif" font-size="10" font-weight="600">No Host Polling Required:</text>
      <text x="15" y="104" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Dispatched autonomously every 1.000 s</text>
      <text x="15" y="120" fill="#a7f3d0" font-family="sans-serif" font-size="9.5">Transmits full struct sof_sound_dose</text>
    </g>
  </g>

  <!-- Center: Interconnect Bus & ALSA Notification Arrows -->
  <g transform="translate(415, 230)">
    <!-- IPC Notification Arrow (DSP -> Host) -->
    <path d="M 0 0 L 140 0" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <polygon points="140,-5 152,0 140,5" fill="#38bdf8" />
    <rect x="15" y="-24" width="120" height="20" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="75" y="-10" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="9.5" font-weight="700">IPC4 NOTIFY (1s)</text>

    <!-- Gain Feedback Control Arrow (Host -> DSP) -->
    <path d="M 152 70 L 0 70" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3" />
    <polygon points="12,65 0,70 12,75" fill="#ef4444" />
    <rect x="15" y="78" width="120" height="20" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <text x="75" y="92" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="9.5" font-weight="700">SET GAIN (dB)</text>
  </g>

  <!-- Right Column: Host Operating System & User-Space Stack -->
  <g transform="translate(580, 85)" filter="url(#shadow5)">
    <rect width="380" height="500" rx="10" fill="url(#hostGrad5)" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="380" height="38" rx="10" fill="#047857" />
    <rect x="0" y="28" width="380" height="10" fill="#047857" />
    <text x="190" y="25" text-anchor="middle" fill="#ecfdf5" font-family="sans-serif" font-size="13.5" font-weight="700">
      HOST LINUX OPERATING SYSTEM &amp; DAEMON
    </text>

    <!-- Kernel SOF Driver -->
    <g transform="translate(20, 55)">
      <rect width="340" height="65" rx="6" fill="#0f172a" stroke="#10b981" />
      <text x="170" y="20" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="11.5" font-weight="700">Kernel ALSA / SOF Driver</text>
      <text x="15" y="38" fill="#e2e8f0" font-family="monospace" font-size="10.5">sound/soc/sof/ipc4-topology.c</text>
      <text x="15" y="54" fill="#a7f3d0" font-family="sans-serif" font-size="10">Dispatches snd_ctl_notify() change event</text>
    </g>

    <!-- User Space Daemon: 7-Day CSD Rolling Accumulator -->
    <g transform="translate(20, 132)">
      <rect width="340" height="135" rx="6" fill="#0f172a" stroke="#f59e0b" />
      <text x="170" y="22" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="11.5" font-weight="700">User-Space Sound Dose Daemon</text>
      <text x="15" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">PipeWire / PulseAudio / CRAS Exposure Service</text>
      <rect x="15" y="52" width="310" height="36" rx="4" fill="#1e293b" />
      <text x="170" y="74" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="10">
        CSD_7d = Σ [ Δt / 40h · 10^((MEL - 80)/10) ]
      </text>
      <text x="15" y="104" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Persistent SQLite/JSON storage across reboots</text>
      <text x="15" y="120" fill="#a7f3d0" font-family="sans-serif" font-size="10">• Sliding 7-day circular exposure FIFO</text>
    </g>

    <!-- Policy & UI Warning Interface -->
    <g transform="translate(20, 279)">
      <rect width="340" height="195" rx="6" fill="url(#uiGrad5)" stroke="#ef4444" stroke-width="1.2" />
      <text x="170" y="22" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="11.5" font-weight="700">Policy Engine &amp; User Protection Actions</text>

      <!-- Sub-states -->
      <g transform="translate(15, 34)">
        <rect width="310" height="42" rx="4" fill="#064e3b" stroke="#10b981" />
        <text x="10" y="18" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="700">CSD &lt; 80%: Normal Operation</text>
        <text x="10" y="32" fill="#e2e8f0" font-family="sans-serif" font-size="9.5">Full volume capability, passive logging</text>
      </g>

      <g transform="translate(15, 84)">
        <rect width="310" height="42" rx="4" fill="#78350f" stroke="#f59e0b" />
        <text x="10" y="18" fill="#fde68a" font-family="sans-serif" font-size="10" font-weight="700">80% ≤ CSD &lt; 100%: Advisory Warning</text>
        <text x="10" y="32" fill="#e2e8f0" font-family="sans-serif" font-size="9.5">System desktop notification displayed to user</text>
      </g>

      <g transform="translate(15, 134)">
        <rect width="310" height="50" rx="4" fill="#7f1d1d" stroke="#f87171" />
        <text x="10" y="18" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="700">CSD ≥ 100% or MEL &gt; 100 dBA: Enforcement</text>
        <text x="10" y="32" fill="#fee2e2" font-family="sans-serif" font-size="9.5">• Injects SOF_SOUND_DOSE_GAIN_PARAM_ID = -12 dB</text>
        <text x="10" y="44" fill="#fca5a5" font-family="sans-serif" font-size="9.5">• Requires explicit user confirmation dialog to override</text>
      </g>
    </g>
  </g>
</svg>
