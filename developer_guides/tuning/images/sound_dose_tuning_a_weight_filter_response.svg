<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" rx="14" fill="url(#bgGrad2)" stroke="#334155" stroke-width="1.5" />

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
    IEC 61672-1 Class 1 A-Weighting Acoustic Filter Cascade
  </text>
  <text x="500" y="60" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    Continuous Theoretical Curve vs SOF Fixed-Point Cascaded DF1 Biquad Implementation (48 kHz / 44.1 kHz)
  </text>

  <!-- Left: Frequency Response Coordinate System (Logarithmic Freq vs Gain dB) -->
  <g transform="translate(45, 85)" filter="url(#shadow2)">
    <rect width="570" height="370" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />

    <!-- Grid lines (Horizontal: dB) -->
    <!-- +10 dB -->
    <line x1="60" y1="50" x2="540" y2="50" stroke="#1e293b" stroke-dasharray="3,3" />
    <text x="52" y="54" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">+10 dB</text>

    <!-- 0 dB -->
    <line x1="60" y1="100" x2="540" y2="100" stroke="#475569" stroke-width="1.2" />
    <text x="52" y="104" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">0 dB</text>

    <!-- -10 dB -->
    <line x1="60" y1="150" x2="540" y2="150" stroke="#1e293b" stroke-dasharray="3,3" />
    <text x="52" y="154" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">-10 dB</text>

    <!-- -20 dB -->
    <line x1="60" y1="200" x2="540" y2="200" stroke="#1e293b" stroke-dasharray="3,3" />
    <text x="52" y="204" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">-20 dB</text>

    <!-- -30 dB -->
    <line x1="60" y1="250" x2="540" y2="250" stroke="#1e293b" stroke-dasharray="3,3" />
    <text x="52" y="254" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">-30 dB</text>

    <!-- -40 dB -->
    <line x1="60" y1="300" x2="540" y2="300" stroke="#1e293b" stroke-dasharray="3,3" />
    <text x="52" y="304" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">-40 dB</text>

    <!-- -50 dB -->
    <line x1="60" y1="340" x2="540" y2="340" stroke="#1e293b" stroke-dasharray="3,3" />
    <text x="52" y="344" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">-50 dB</text>

    <!-- Vertical Grid (Log Freq: 20Hz, 100Hz, 1kHz, 3kHz, 10kHz, 20kHz) -->
    <!-- 20 Hz -->
    <line x1="80" y1="30" x2="80" y2="340" stroke="#1e293b" stroke-dasharray="3,3" />
    <text x="80" y="358" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">20 Hz</text>

    <!-- 100 Hz -->
    <line x1="180" y1="30" x2="180" y2="340" stroke="#1e293b" stroke-dasharray="3,3" />
    <text x="180" y="358" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">100 Hz</text>

    <!-- 1 kHz -->
    <line x1="330" y1="30" x2="330" y2="340" stroke="#475569" stroke-width="1.2" />
    <text x="330" y="358" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">1 kHz</text>

    <!-- 3.15 kHz (Ear resonance peak) -->
    <line x1="410" y1="30" x2="410" y2="340" stroke="#38bdf8" stroke-dasharray="2,2" stroke-opacity="0.5" />
    <text x="410" y="358" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="10">3.15 kHz</text>

    <!-- 10 kHz -->
    <line x1="480" y1="30" x2="480" y2="340" stroke="#1e293b" stroke-dasharray="3,3" />
    <text x="480" y="358" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">10 kHz</text>

    <!-- 20 kHz -->
    <line x1="530" y1="30" x2="530" y2="340" stroke="#1e293b" stroke-dasharray="3,3" />
    <text x="530" y="358" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">20 kHz</text>

    <!-- Class 1 Tolerance Mask Band (Shaded area around curve between 100Hz and 4kHz) -->
    <path d="M 180 188 C 240 148, 300 102, 330 92 C 370 80, 410 82, 440 92 L 440 108 C 410 98, 370 96, 330 108 C 300 118, 240 164, 180 204 Z" fill="#38bdf8" fill-opacity="0.12" />
    <text x="250" y="130" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600">±1.0 dB Class 1 Mask</text>

    <!-- Ideal IEC 61672-1 Curve (Cyan dashed) -->
    <path d="M 80 342 C 110 300, 140 245, 180 196 C 240 156, 290 110, 330 100 C 370 90, 405 88, 430 94 C 470 106, 500 125, 530 146" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4,3" />

    <!-- SOF DF1 IIR Cascade at 48 kHz (Emerald Solid Line) -->
    <path d="M 80 342 C 110 299, 140 244, 180 196 C 240 156, 290 110, 330 100 C 370 90, 405 89, 430 95 C 470 108, 500 128, 530 152" fill="none" stroke="#10b981" stroke-width="2.6" />

    <!-- Key Points Callouts -->
    <!-- 20 Hz (-50.5 dB) -->
    <circle cx="80" cy="342" r="3.5" fill="#10b981" />
    <!-- 100 Hz (-19.1 dB) -->
    <circle cx="180" cy="196" r="3.5" fill="#10b981" />
    <text x="186" y="214" fill="#a7f3d0" font-family="monospace" font-size="10">-19.1 dB</text>

    <!-- 1 kHz (0.0 dB ref) -->
    <circle cx="330" cy="100" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.2" />
    <text x="335" y="85" fill="#fde68a" font-family="monospace" font-size="11" font-weight="700">0.0 dB (Ref)</text>

    <!-- 3.15 kHz (+1.2 dB peak) -->
    <circle cx="410" cy="90" r="4" fill="#10b981" />
    <text x="415" y="78" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="700">+1.2 dB</text>

    <!-- Legend box inside plot -->
    <g transform="translate(75, 42)">
      <rect width="210" height="46" rx="4" fill="#1e293b" fill-opacity="0.85" stroke="#334155" />
      <line x1="12" y1="15" x2="35" y2="15" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4,2" />
      <text x="42" y="19" fill="#94a3b8" font-family="sans-serif" font-size="10.5">IEC 61672-1 Class 1 Target</text>
      <line x1="12" y1="32" x2="35" y2="32" stroke="#10b981" stroke-width="2.5" />
      <text x="42" y="36" fill="#6ee7b7" font-family="sans-serif" font-size="10.5" font-weight="600">SOF Cascaded DF1 IIR (48k)</text>
    </g>
  </g>

  <!-- Right: 3-Stage Biquad Cascade Architecture -->
  <g transform="translate(635, 85)" filter="url(#shadow2)">
    <rect width="320" height="370" rx="8" fill="url(#cardGrad2)" stroke="#475569" stroke-width="1.2" />
    <text x="160" y="26" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">
      SOF Cascaded DF1 Biquad Structure
    </text>
    <text x="160" y="44" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">
      Pre-computed 6-pole, 2-zero IIR Filter
    </text>

    <!-- Stage 1 Box -->
    <g transform="translate(20, 60)">
      <rect width="280" height="68" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <text x="15" y="20" fill="#34d399" font-family="sans-serif" font-size="11.5" font-weight="700">Biquad 1: Sub-Audible High-Pass</text>
      <text x="15" y="38" fill="#94a3b8" font-family="monospace" font-size="10">f_p1,2 = 20.6 Hz (HP1 + HP1 pair)</text>
      <text x="15" y="54" fill="#cbd5e1" font-family="sans-serif" font-size="10">Eliminates DC bias &amp; sub-acoustic rumble</text>
    </g>

    <line x1="160" y1="130" x2="160" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Stage 2 Box -->
    <g transform="translate(20, 150)">
      <rect width="280" height="68" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <text x="15" y="20" fill="#38bdf8" font-family="sans-serif" font-size="11.5" font-weight="700">Biquad 2: Mid-Bass Transition</text>
      <text x="15" y="38" fill="#94a3b8" font-family="monospace" font-size="10">f_p3 = 107.7 Hz, f_p4 = 737.9 Hz</text>
      <text x="15" y="54" fill="#cbd5e1" font-family="sans-serif" font-size="10">Forms +20 dB/dec rolloff slope</text>
    </g>

    <line x1="160" y1="220" x2="160" y2="238" stroke="#64748b" stroke-width="1.5" />

    <!-- Stage 3 Box -->
    <g transform="translate(20, 240)">
      <rect width="280" height="68" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
      <text x="15" y="20" fill="#fbbf24" font-family="sans-serif" font-size="11.5" font-weight="700">Biquad 3: Ultrasonic Low-Pass</text>
      <text x="15" y="38" fill="#94a3b8" font-family="monospace" font-size="10">f_p5,6 = 12,194 Hz (LP2 pair)</text>
      <text x="15" y="54" fill="#cbd5e1" font-family="sans-serif" font-size="10">Rolls off ultrasonic content above 12 kHz</text>
    </g>

    <!-- Normalization Note -->
    <g transform="translate(20, 320)">
      <rect width="280" height="36" rx="4" fill="#334155" fill-opacity="0.6" />
      <text x="10" y="16" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">Normalization: -3.0 dB at 1 kHz in firmware</text>
      <text x="10" y="28" fill="#94a3b8" font-family="sans-serif" font-size="9.5">+3.0 dB offset added back during log conversion</text>
    </g>
  </g>

  <!-- Bottom Panel: Mathematical Continuous Formulation & Bilinear Pre-warping -->
  <g transform="translate(45, 475)" filter="url(#shadow2)">
    <rect width="910" height="100" rx="8" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.2" />
    <text x="25" y="24" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">
      IEC 61672-1 Analytic Weighting Formula &amp; Bilinear Transformation Pre-Warping
    </text>
    <text x="25" y="48" fill="#f8fafc" font-family="monospace" font-size="12">
      R_A(f) = (12194² · f⁴) / [ (f² + 20.6²) · √((f² + 107.7²)(f² + 737.9²)) · (f² + 12194²) ]
    </text>
    <text x="25" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">
      Continuous-to-discrete mapping uses Bilinear Transform with pre-warping: <tspan fill="#6ee7b7" font-family="monospace">ω_a = 2·f_s · tan(π·F_c / f_s)</tspan>.
    </text>
    <text x="25" y="86" fill="#94a3b8" font-family="sans-serif" font-size="11">
      At 48 kHz, cascaded Direct Form I structures exhibit negligible frequency warping below 10 kHz, ensuring compliance within Class 1 bounds.
    </text>
  </g>
</svg>
