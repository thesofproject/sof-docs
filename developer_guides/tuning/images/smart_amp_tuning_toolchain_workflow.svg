<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .subcard { fill: #21262d; stroke: #30363d; stroke-width: 1; rx: 6px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #58a6ff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #8b949e; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #79c0ff; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #c9d1d9; }
      .label-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #f0f6fc; }
      .code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #e6edf3; }
      .code-accent { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #3fb950; font-weight: 600; }
      .code-orange { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #f0883e; }
      .code-purple { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #d2a8ff; }
      .code-red { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #ff7b72; }
      .line-blue { stroke: #58a6ff; stroke-width: 2; fill: none; }
      .line-green { stroke: #3fb950; stroke-width: 2; fill: none; }
      .line-orange { stroke: #f0883e; stroke-width: 2; fill: none; }
      .box-phase { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
    </style>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <rect width="1100" height="620" class="bg" />

  <text x="35" y="38" class="title">End-to-End Smart Amplifier Acoustic Characterization and Telemetry Workflow</text>
  <text x="35" y="58" class="subtitle">From Laser Transducer Metrology to Topology 2 Packaging, Runtime Injection, and Live Voice Coil Telemetry</text>

  <!-- 5 Horizontal Phase Cards -->
  <!-- Phase 1: Transducer Metrology -->
  <g transform="translate(35, 85)">
    <rect x="0" y="0" width="195" height="420" class="box-phase" stroke="#58a6ff" />
    <rect x="0" y="0" width="195" height="32" fill="#1f2937" rx="8" />
    <circle cx="18" cy="16" r="10" fill="#58a6ff" />
    <text x="14" y="20" class="badge">1</text>
    <text x="35" y="20" class="label-bold" fill="#79c0ff">Transducer Metrology</text>

    <!-- Content -->
    <rect x="10" y="45" width="175" height="75" class="subcard" />
    <text x="18" y="63" class="label-bold">Klippel / Laser</text>
    <text x="18" y="80" class="code">Laser Vibrometer</text>
    <text x="18" y="96" class="subtitle" font-size="10px">Displacement X(f)</text>
    <text x="18" y="110" class="code-accent">Xmax, Xmech limit</text>

    <rect x="10" y="130" width="175" height="95" class="subcard" />
    <text x="18" y="148" class="label-bold">Thiele-Small Extr.</text>
    <text x="18" y="165" class="code">Fs, Qms, Qes, Qts</text>
    <text x="18" y="181" class="code">Bl, Mms, Cms, Rms</text>
    <text x="18" y="197" class="code">Sd, Vas volume</text>
    <text x="18" y="213" class="code-orange">Re0 @ 25°C baseline</text>

    <rect x="10" y="235" width="175" height="85" class="subcard" />
    <text x="18" y="253" class="label-bold">Thermal Soak Test</text>
    <text x="18" y="270" class="code">IEC 60268-5 noise</text>
    <text x="18" y="286" class="code-red">Rth,vc, Cth,vc (τ1)</text>
    <text x="18" y="302" class="code-red">Rth,mag, Cth,mag (τ2)</text>
    <text x="18" y="316" class="subtitle" font-size="9px">Thermal camera verify</text>

    <rect x="10" y="330" width="175" height="75" class="subcard" />
    <text x="18" y="348" class="label-bold">Deliverables:</text>
    <text x="18" y="366" class="code-accent">speaker_ts.json</text>
    <text x="18" y="382" class="code-orange">thermal_params.csv</text>
    <text x="18" y="398" class="code">Safety boundary spec</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 230 295 L 250 295" class="line-blue" marker-end="url(#arr-b)" />

  <!-- Phase 2: Algorithm Synthesis -->
  <g transform="translate(250, 85)">
    <rect x="0" y="0" width="195" height="420" class="box-phase" stroke="#3fb950" />
    <rect x="0" y="0" width="195" height="32" fill="#1c2724" rx="8" />
    <circle cx="18" cy="16" r="10" fill="#3fb950" />
    <text x="14" y="20" class="badge">2</text>
    <text x="35" y="20" class="label-bold" fill="#7ee787">Model Calibration</text>

    <rect x="10" y="45" width="175" height="85" class="subcard" />
    <text x="18" y="63" class="label-bold">Python / Octave</text>
    <text x="18" y="80" class="code">sof_dsm_calib.py</text>
    <text x="18" y="96" class="subtitle" font-size="10px">Convert SI units to</text>
    <text x="18" y="110" class="code-accent">Q-format DSM params</text>
    <text x="18" y="124" class="code">Delay &amp; buffer sizing</text>

    <rect x="10" y="140" width="175" height="95" class="subcard" />
    <text x="18" y="158" class="label-bold">Excursion Limiter</text>
    <text x="18" y="175" class="code">Kms(x) compensation</text>
    <text x="18" y="191" class="code">Adaptive HPF cutoff</text>
    <text x="18" y="207" class="code-orange">Attack: 1.0 ms</text>
    <text x="18" y="223" class="code-orange">Release: 50 ms</text>

    <rect x="10" y="245" width="175" height="85" class="subcard" />
    <text x="18" y="263" class="label-bold">Thermal Limiter</text>
    <text x="18" y="280" class="code-red">Twarn = 95°C</text>
    <text x="18" y="296" class="code-red">Tlimit = 115°C</text>
    <text x="18" y="312" class="code-red">Tcutoff = 130°C</text>
    <text x="18" y="326" class="code">Smooth multiband gain</text>

    <rect x="10" y="340" width="175" height="65" class="subcard" />
    <text x="18" y="358" class="label-bold">Deliverables:</text>
    <text x="18" y="376" class="code-accent">dsm_params.bin</text>
    <text x="18" y="392" class="code">Raw calibration blob</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 445 295 L 465 295" class="line-blue" marker-end="url(#arr-b)" />

  <!-- Phase 3: Topology Integration -->
  <g transform="translate(465, 85)">
    <rect x="0" y="0" width="195" height="420" class="box-phase" stroke="#bc8cff" />
    <rect x="0" y="0" width="195" height="32" fill="#291d38" rx="8" />
    <circle cx="18" cy="16" r="10" fill="#bc8cff" />
    <text x="14" y="20" class="badge">3</text>
    <text x="35" y="20" class="label-bold" fill="#d2a8ff">Topology Packaging</text>

    <rect x="10" y="45" width="175" height="85" class="subcard" />
    <text x="18" y="63" class="label-bold">Topology 2 Widget</text>
    <text x="18" y="80" class="code">Class.Widget."smart_amp"</text>
    <text x="18" y="96" class="code">num_input_pins 2</text>
    <text x="18" y="112" class="code">num_output_pins 1</text>
    <text x="18" y="126" class="code-purple">cpc 5000 | is_pages 1</text>

    <rect x="10" y="140" width="175" height="95" class="subcard" />
    <text x="18" y="158" class="label-bold">Channel Routing</text>
    <text x="18" y="175" class="code">source_ch_map:</text>
    <text x="18" y="191" class="code-accent">[0, 1, -1, -1, ...]</text>
    <text x="18" y="207" class="code">feedback_ch_map:</text>
    <text x="18" y="223" class="code-orange">[-1, -1, 0, 1, ...]</text>

    <rect x="10" y="245" width="175" height="85" class="subcard" />
    <text x="18" y="263" class="label-bold">ALSA Byte Control</text>
    <text x="18" y="280" class="code">Object.Control.bytes."1"</text>
    <text x="18" y="296" class="code">max 4096 bytes</text>
    <text x="18" y="312" class="code-purple">SMART_AMP_UUID</text>
    <text x="18" y="326" class="subtitle" font-size="9px">IPC4 BaseCfgExt init</text>

    <rect x="10" y="340" width="175" height="65" class="subcard" />
    <text x="18" y="358" class="label-bold">Deliverables:</text>
    <text x="18" y="376" class="code-accent">sof-board-dsm.tplg</text>
    <text x="18" y="392" class="code">Compiled binary tplg</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 660 295 L 680 295" class="line-blue" marker-end="url(#arr-b)" />

  <!-- Phase 4: Runtime Injection -->
  <g transform="translate(680, 85)">
    <rect x="0" y="0" width="185" height="420" class="box-phase" stroke="#f0883e" />
    <rect x="0" y="0" width="185" height="32" fill="#33221a" rx="8" />
    <circle cx="18" cy="16" r="10" fill="#f0883e" />
    <text x="14" y="20" class="badge">4</text>
    <text x="35" y="20" class="label-bold" fill="#ffa657">Runtime Injection</text>

    <rect x="10" y="45" width="165" height="85" class="subcard" />
    <text x="18" y="63" class="label-bold">sof-ctl Tool</text>
    <text x="18" y="80" class="code">sof-ctl -D hw:0</text>
    <text x="18" y="96" class="code">-n 'Smart Amp'</text>
    <text x="18" y="112" class="code-orange">-s dsm_blob.bin</text>
    <text x="18" y="126" class="code">Live zero-glitch push</text>

    <rect x="10" y="140" width="165" height="95" class="subcard" />
    <text x="18" y="158" class="label-bold">IPC ABI Dispatch</text>
    <text x="18" y="175" class="code">SOF_CTRL_CMD_BINARY</text>
    <text x="18" y="191" class="code">SOF_SMART_AMP_MODEL</text>
    <text x="18" y="207" class="code-accent">ID + Value pairs (8B)</text>
    <text x="18" y="223" class="subtitle" font-size="9px">Stereo / Per-channel</text>

    <rect x="10" y="245" width="165" height="85" class="subcard" />
    <text x="18" y="263" class="label-bold">Inner Model Set</text>
    <text x="18" y="280" class="code">mod_ops-&gt;set_config</text>
    <text x="18" y="296" class="code">dsm_api_set_params</text>
    <text x="18" y="312" class="code-accent">Updates active state</text>
    <text x="18" y="326" class="subtitle" font-size="9px">No DSP reset required</text>

    <rect x="10" y="340" width="165" height="65" class="subcard" />
    <text x="18" y="358" class="label-bold">Result:</text>
    <text x="18" y="376" class="code-accent">Live Calibration Active</text>
    <text x="18" y="392" class="subtitle" font-size="10px">Audible in real-time</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 865 295 L 885 295" class="line-blue" marker-end="url(#arr-b)" />

  <!-- Phase 5: Telemetry & Safety Verify -->
  <g transform="translate(885, 85)">
    <rect x="0" y="0" width="180" height="420" class="box-phase" stroke="#ff7b72" />
    <rect x="0" y="0" width="180" height="32" fill="#311c23" rx="8" />
    <circle cx="18" cy="16" r="10" fill="#ff7b72" />
    <text x="14" y="20" class="badge">5</text>
    <text x="35" y="20" class="label-bold" fill="#ff7b72">Live Telemetry &amp; QA</text>

    <rect x="10" y="45" width="160" height="85" class="subcard" />
    <text x="18" y="63" class="label-bold">Volatile Telemetry</text>
    <text x="18" y="80" class="code">sof-ctl -g telemetry</text>
    <text x="18" y="96" class="code-red">Cmd 0x10: Tv(t) temp</text>
    <text x="18" y="112" class="code-orange">Cmd 0x11: Re(t) res</text>
    <text x="18" y="126" class="code-accent">Cmd 0x12: Xpeak mm</text>

    <rect x="10" y="140" width="160" height="95" class="subcard" />
    <text x="18" y="158" class="label-bold">Stress Testing</text>
    <text x="18" y="175" class="code">0 dBFS Sine Sweeps</text>
    <text x="18" y="191" class="code">EIAJ Dynamic Noise</text>
    <text x="18" y="207" class="code">100-hour soak test</text>
    <text x="18" y="223" class="code-accent">Zero transducer burn</text>

    <rect x="10" y="245" width="160" height="85" class="subcard" />
    <text x="18" y="263" class="label-bold">Acoustic QA</text>
    <text x="18" y="280" class="code">Sound Pressure (SPL)</text>
    <text x="18" y="296" class="code">THD+N &lt; 5% Target</text>
    <text x="18" y="312" class="code">Rub &amp; buzz detection</text>
    <text x="18" y="326" class="code-accent">+8 dB loudness gain</text>

    <rect x="10" y="340" width="160" height="65" class="subcard" />
    <text x="18" y="358" class="label-bold">Certification:</text>
    <text x="18" y="376" class="code-accent">Production Ready</text>
    <text x="18" y="392" class="subtitle" font-size="10px">Sign-off for Golden Tplg</text>
  </g>

  <!-- Bottom Feedback Loop Arrow (Phase 5 back to Phase 2) -->
  <g transform="translate(35, 520)">
    <rect x="0" y="0" width="1030" height="75" class="card" />
    <path d="M 960 0 L 960 35 L 340 35 L 340 0" class="line-green" stroke-dasharray="4,4" marker-end="url(#arr-g)" />
    <text x="400" y="55" class="label-bold" fill="#3fb950">Iterative Acoustic Feedback: Online Telemetry Calibration Loop</text>
    <text x="400" y="70" class="subtitle">Real-time thermal tracking and excursion measurements calibrate room-temperature baseline parameters</text>
  </g>
</svg>
