<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .subcard { fill: #21262d; stroke: #30363d; stroke-width: 1; rx: 6px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #58a6ff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #8b949e; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #79c0ff; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #c9d1d9; }
      .label-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #f0f6fc; }
      .code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #e6edf3; }
      .code-accent { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #3fb950; font-weight: 600; }
      .code-orange { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #f0883e; }
      .code-purple { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #d2a8ff; }
      .code-red { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #ff7b72; }
      .grid { stroke: #21262d; stroke-width: 1; }
      .axis { stroke: #484f58; stroke-width: 1.5; }
      .curve-unprotected { stroke: #ff7b72; stroke-width: 2.5; stroke-dasharray: 5,4; fill: none; }
      .curve-protected { stroke: #3fb950; stroke-width: 3; fill: none; }
      .curve-limit { stroke: #f0883e; stroke-width: 1.5; stroke-dasharray: 4,4; }
    </style>
  </defs>

  <rect width="1100" height="620" class="bg" />

  <text x="35" y="38" class="title">Dynamic Excursion Limiting and Voice Coil Thermal Protection Curves</text>
  <text x="35" y="58" class="subtitle">Physics-Based Nonlinear Transducer Boundaries vs. Adaptive Frequency and Gain Attenuation</text>

  <!-- ==================== LEFT PLOT: EXCURSION VS FREQUENCY ==================== -->
  <rect x="35" y="80" width="505" height="515" class="card" />
  <rect x="45" y="90" width="485" height="26" class="subcard" />
  <text x="55" y="108" class="section-title" fill="#58a6ff">A. Mechanical Excursion vs. Frequency: X(f)</text>

  <!-- Plot Area -->
  <g transform="translate(85, 140)">
    <!-- Background Grid -->
    <line x1="0" y1="0" x2="420" y2="0" class="grid" />
    <line x1="0" y1="70" x2="420" y2="70" class="grid" />
    <line x1="0" y1="140" x2="420" y2="140" class="grid" />
    <line x1="0" y1="210" x2="420" y2="210" class="grid" />
    <line x1="0" y1="280" x2="420" y2="280" class="grid" />
    <line x1="0" y1="350" x2="420" y2="350" class="grid" />

    <line x1="0" y1="0" x2="0" y2="350" class="grid" />
    <line x1="105" y1="0" x2="105" y2="350" class="grid" />
    <line x1="210" y1="0" x2="210" y2="350" class="grid" />
    <line x1="315" y1="0" x2="315" y2="350" class="grid" />
    <line x1="420" y1="0" x2="420" y2="350" class="grid" />

    <!-- Axes -->
    <line x1="0" y1="350" x2="420" y2="350" class="axis" />
    <line x1="0" y1="0" x2="0" y2="350" class="axis" />

    <!-- Y-Axis Labels (Peak Excursion in mm) -->
    <text x="-40" y="75" class="code-red">0.80</text>
    <text x="-40" y="145" class="code-orange">0.50</text>
    <text x="-40" y="215" class="code">0.30</text>
    <text x="-40" y="285" class="code">0.15</text>
    <text x="-40" y="355" class="code">0.00</text>
    <text x="-70" y="200" class="label-bold" transform="rotate(-90, -70, 200)" fill="#8b949e">Excursion (mm pk)</text>

    <!-- X-Axis Labels (Frequency in Hz, Log Scale) -->
    <text x="-5" y="370" class="code">20</text>
    <text x="100" y="370" class="code">100</text>
    <text x="200" y="370" class="code-accent">850 (Fs)</text>
    <text x="310" y="370" class="code">3000</text>
    <text x="405" y="370" class="code">10k</text>
    <text x="180" y="395" class="label-bold" fill="#8b949e">Frequency (Hz)</text>

    <!-- Threshold lines -->
    <!-- Xmech destruction boundary -->
    <line x1="0" y1="70" x2="420" y2="70" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="260" y="65" class="code-red" font-size="10px">Xmech (0.80 mm) - Mechanical Damage!</text>

    <!-- Xmax safe limit -->
    <line x1="0" y1="140" x2="420" y2="140" stroke="#f0883e" stroke-width="2" stroke-dasharray="4,4" />
    <text x="260" y="134" class="code-orange" font-size="10px">Xmax (0.50 mm) - Distortion Threshold</text>

    <!-- Curve 1: Unprotected full-scale drive (Explodes below Fs) -->
    <path d="M 0 30 Q 60 40 105 70 T 210 110 T 315 260 T 420 340" class="curve-unprotected" />
    <text x="15" y="55" class="code-red" font-size="10px">Unprotected (+12 dBFS)</text>

    <!-- Curve 2: DSM Protected Output with Adaptive High-Pass Filter -->
    <!-- Clamped precisely at Xmax 140 line, drops smoothly -->
    <path d="M 0 350 L 50 350 Q 80 340 110 240 Q 140 145 180 140 L 220 140 Q 260 160 315 260 T 420 340" class="curve-protected" />
    <text x="130" y="180" class="code-accent" font-size="11px">DSM Protected (Adaptive HPF)</text>

    <!-- Annotation badge -->
    <rect x="15" y="270" width="180" height="60" class="subcard" stroke="#3fb950" />
    <text x="25" y="288" class="label-bold" fill="#3fb950">Excursion Protection:</text>
    <text x="25" y="304" class="subtitle" font-size="10px">Adaptive cutoff shifts up</text>
    <text x="25" y="318" class="code-accent" font-size="10px">from 80 Hz --&gt; 350 Hz</text>
  </g>

  <!-- ==================== RIGHT PLOT: THERMAL RISE OVER TIME ==================== -->
  <rect x="560" y="80" width="505" height="515" class="card" />
  <rect x="570" y="90" width="485" height="26" class="subcard" />
  <text x="580" y="108" class="section-title" fill="#ff7b72">B. Thermal Rise vs. Time: Tv(t) &amp; Compression</text>

  <!-- Plot Area -->
  <g transform="translate(610, 140)">
    <!-- Background Grid -->
    <line x1="0" y1="0" x2="420" y2="0" class="grid" />
    <line x1="0" y1="70" x2="420" y2="70" class="grid" />
    <line x1="0" y1="140" x2="420" y2="140" class="grid" />
    <line x1="0" y1="210" x2="420" y2="210" class="grid" />
    <line x1="0" y1="280" x2="420" y2="280" class="grid" />
    <line x1="0" y1="350" x2="420" y2="350" class="grid" />

    <line x1="0" y1="0" x2="0" y2="350" class="grid" />
    <line x1="105" y1="0" x2="105" y2="350" class="grid" />
    <line x1="210" y1="0" x2="210" y2="350" class="grid" />
    <line x1="315" y1="0" x2="315" y2="350" class="grid" />
    <line x1="420" y1="0" x2="420" y2="350" class="grid" />

    <!-- Axes -->
    <line x1="0" y1="350" x2="420" y2="350" class="axis" />
    <line x1="0" y1="0" x2="0" y2="350" class="axis" />

    <!-- Y-Axis Labels (Temperature in °C) -->
    <text x="-40" y="75" class="code-red">135°C</text>
    <text x="-40" y="145" class="code-orange">115°C</text>
    <text x="-40" y="215" class="code-accent">95°C</text>
    <text x="-40" y="285" class="code">60°C</text>
    <text x="-40" y="355" class="code">25°C</text>
    <text x="-65" y="200" class="label-bold" transform="rotate(-90, -65, 200)" fill="#8b949e">Voice Coil Temp Tv(t)</text>

    <!-- X-Axis Labels (Time in Seconds) -->
    <text x="-5" y="370" class="code">0s</text>
    <text x="100" y="370" class="code">10s</text>
    <text x="200" y="370" class="code">30s</text>
    <text x="305" y="370" class="code">60s</text>
    <text x="405" y="370" class="code">180s</text>
    <text x="190" y="395" class="label-bold" fill="#8b949e">Time (s)</text>

    <!-- Threshold lines -->
    <!-- Tcutoff (Destruction) -->
    <line x1="0" y1="70" x2="420" y2="70" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="250" y="65" class="code-red" font-size="10px">Tcutoff (135°C) - Coil Adhesive Breakdown</text>

    <!-- Tlimit (Maximum safe target) -->
    <line x1="0" y1="140" x2="420" y2="140" stroke="#f0883e" stroke-width="2" stroke-dasharray="4,4" />
    <text x="250" y="134" class="code-orange" font-size="10px">Tlimit (115°C) - Regulated Ceiling</text>

    <!-- Twarn (Limiter Engagement) -->
    <line x1="0" y1="210" x2="420" y2="210" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="2,2" />
    <text x="250" y="204" class="code-accent" font-size="10px">Twarn (95°C) - Thermal Gain Reduction Active</text>

    <!-- Curve 1: Unregulated Thermal Runaway -->
    <path d="M 0 350 Q 50 180 105 110 T 210 30" class="curve-unprotected" />
    <text x="60" y="90" class="code-red" font-size="10px">Unprotected Burnout</text>

    <!-- Curve 2: Regulated DSM Closed-Loop Temperature -->
    <!-- Rises fast with tau_vc, hits Twarn, soft-knees and levels off exactly at Tlimit -->
    <path d="M 0 350 Q 40 220 80 180 Q 140 145 210 142 L 420 142" class="curve-protected" />
    <text x="210" y="165" class="code-accent" font-size="11px">DSM Thermal Closed-Loop (Regulated at Tlimit)</text>

    <!-- Annotation badge -->
    <rect x="230" y="270" width="180" height="60" class="subcard" stroke="#ff7b72" />
    <text x="240" y="288" class="label-bold" fill="#ff7b72">Thermal Limiter:</text>
    <text x="240" y="304" class="subtitle" font-size="10px">Dual-rate attenuation:</text>
    <text x="240" y="318" class="code-orange" font-size="10px">Smooth wideband -3 dB to -6 dB</text>
  </g>
</svg>
