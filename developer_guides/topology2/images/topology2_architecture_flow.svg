<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0f172a; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#34d399" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)" />

  <!-- Title Header -->
  <g transform="translate(40, 30)">
    <text x="0" y="24" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.02em">ALSA Topology 2.0 Architectural &amp; Compilation Flow</text>
    <text x="0" y="46" fill="#94a3b8" font-size="13">Object-oriented class modeling, pre-processor compilation engine (alsatplg -p), and binary generation</text>
  </g>

  <!-- Left Column: Source Configuration Structure -->
  <g transform="translate(40, 90)">
    <!-- Main Panel -->
    <rect width="320" height="550" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect width="320" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="21" r="5" fill="#38bdf8" />
    <text x="35" y="26" fill="#f1f5f9" font-size="14" font-weight="600">1. Topology 2.0 Source Tree</text>

    <!-- Sub-block 1: Class Definitions -->
    <g transform="translate(16, 56)">
      <rect width="288" height="150" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1" stroke-opacity="0.5" />
      <text x="12" y="22" fill="#38bdf8" font-size="12" font-weight="700">CLASS DEFINITIONS (include/)</text>

      <rect x="12" y="32" width="264" height="26" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="22" y="49" fill="#e2e8f0" font-size="11" font-family="monospace">Class.Widget."gain" { ... }</text>

      <rect x="12" y="64" width="264" height="26" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="22" y="81" fill="#e2e8f0" font-size="11" font-family="monospace">Class.Pipeline."volume-playback"</text>

      <rect x="12" y="96" width="264" height="26" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="22" y="113" fill="#e2e8f0" font-size="11" font-family="monospace">Class.DAI."SSP" / Class.Base.data</text>

      <text x="12" y="138" fill="#94a3b8" font-size="10">Defines attributes, qualifiers, constraints &amp; tokens</text>
    </g>

    <!-- Sub-block 2: Platform Overrides -->
    <g transform="translate(16, 218)">
      <rect width="288" height="110" rx="8" fill="#1e293b" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.5" />
      <text x="12" y="22" fill="#c084fc" font-size="12" font-weight="700">PLATFORM OVERRIDES (platform/)</text>

      <rect x="12" y="32" width="264" height="24" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="22" y="48" fill="#e2e8f0" font-size="11" font-family="monospace">platform/intel/mtl.conf, ptl.conf</text>

      <rect x="12" y="62" width="264" height="24" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="22" y="78" fill="#e2e8f0" font-size="11" font-family="monospace">Define { SSP_BLOB_VERSION ... }</text>

      <text x="12" y="100" fill="#94a3b8" font-size="10">Hardware blobs, cardinal clocks, gateway masks</text>
    </g>

    <!-- Sub-block 3: Top-Level Entry Points -->
    <g transform="translate(16, 340)">
      <rect width="288" height="190" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1" stroke-opacity="0.5" />
      <text x="12" y="22" fill="#34d399" font-size="12" font-weight="700">TOP-LEVEL ENTRY CONFIGS (.conf)</text>

      <rect x="12" y="32" width="264" height="24" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="22" y="48" fill="#cbd5e1" font-size="11" font-family="monospace">cavs-sdw.conf, sof-hda-generic.conf</text>

      <rect x="12" y="62" width="264" height="24" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="22" y="78" fill="#cbd5e1" font-size="11" font-family="monospace">IncludeByKey.PLATFORM { ... }</text>

      <rect x="12" y="92" width="264" height="24" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="22" y="108" fill="#cbd5e1" font-size="11" font-family="monospace">Object.Pipeline.host-copier-gain.1</text>

      <rect x="12" y="122" width="264" height="24" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="22" y="138" fill="#cbd5e1" font-size="11" font-family="monospace">Object.Base.route [ { source ... } ]</text>

      <text x="12" y="160" fill="#94a3b8" font-size="10">Instantiates pipeline objects, endpoints &amp; routes</text>
      <text x="12" y="176" fill="#94a3b8" font-size="10">Defines build args (@args.DMIC_COUNT)</text>
    </g>
  </g>

  <!-- Connectors Left -> Middle -->
  <path d="M 360 210 L 415 210" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)" />
  <path d="M 360 300 L 415 320" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowPurple)" />
  <path d="M 360 440 L 415 410" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowEmerald)" />

  <!-- Middle Column: alsatplg -p Engine -->
  <g transform="translate(420, 90)">
    <rect width="380" height="550" rx="12" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect width="380" height="42" rx="12" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="21" r="5" fill="#f8fafc" />
    <text x="35" y="26" fill="#ffffff" font-size="14" font-weight="700">2. Pre-Processor Engine (alsatplg -p)</text>

    <!-- Flow Steps -->
    <!-- Step A -->
    <g transform="translate(20, 60)">
      <rect width="340" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="22" r="12" fill="#0284c7" />
      <text x="24" y="26" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">A</text>
      <text x="46" y="24" fill="#f1f5f9" font-size="13" font-weight="600">Lexical Analysis &amp; AST Construction</text>
      <text x="46" y="42" fill="#94a3b8" font-size="11">Parses <tspan fill="#38bdf8">Class</tspan>, <tspan fill="#38bdf8">Object</tspan>, <tspan fill="#38bdf8">Define</tspan>, and <tspan fill="#38bdf8">IncludeByKey</tspan></text>
      <text x="46" y="58" fill="#64748b" font-size="10">Builds hierarchical object graph without text macro expansion</text>
    </g>

    <!-- Down arrow -->
    <line x1="190" y1="136" x2="190" y2="152" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />

    <!-- Step B -->
    <g transform="translate(20, 154)">
      <rect width="340" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="22" r="12" fill="#0284c7" />
      <text x="24" y="26" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">B</text>
      <text x="46" y="24" fill="#f1f5f9" font-size="13" font-weight="600">Attribute Inheritance &amp; Resolution</text>
      <text x="46" y="42" fill="#94a3b8" font-size="11">Resolves <tspan fill="#e2e8f0">$VARIABLE</tspan> references and cascades defaults</text>
      <text x="46" y="58" fill="#64748b" font-size="10">Builds object names via <tspan fill="#f1f5f9">!constructor</tspan> tuples (<tspan fill="#f1f5f9">index, instance</tspan>)</text>
    </g>

    <!-- Down arrow -->
    <line x1="190" y1="230" x2="190" y2="246" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />

    <!-- Step C -->
    <g transform="translate(20, 248)">
      <rect width="340" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="22" r="12" fill="#0284c7" />
      <text x="24" y="26" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">C</text>
      <text x="46" y="24" fill="#f1f5f9" font-size="13" font-weight="600">Constraint &amp; Schema Validation</text>
      <text x="46" y="42" fill="#94a3b8" font-size="11">Validates <tspan fill="#f43f5e">!mandatory</tspan>, locks <tspan fill="#cbd5e1">!immutable</tspan>, checks types</text>
      <text x="46" y="58" fill="#64748b" font-size="10">Enforces uniqueness (<tspan fill="#f1f5f9">unique "instance"</tspan>) &amp; value ranges</text>
    </g>

    <!-- Down arrow -->
    <line x1="190" y1="324" x2="190" y2="340" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />

    <!-- Step D -->
    <g transform="translate(20, 342)">
      <rect width="340" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="22" r="12" fill="#0284c7" />
      <text x="24" y="26" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">D</text>
      <text x="46" y="24" fill="#f1f5f9" font-size="13" font-weight="600">Route Linkage &amp; Dynamic Substitution</text>
      <text x="46" y="42" fill="#94a3b8" font-size="11">Resolves relative route endpoints (<tspan fill="#f1f5f9">buffer..1 -&gt; buffer.1.1</tspan>)</text>
      <text x="46" y="58" fill="#64748b" font-size="10">Populates widget and pipeline parent-child references</text>
    </g>

    <!-- Down arrow -->
    <line x1="190" y1="418" x2="190" y2="434" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />

    <!-- Step E -->
    <g transform="translate(20, 436)">
      <rect width="340" height="88" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2" />
      <circle cx="24" cy="22" r="12" fill="#059669" />
      <text x="24" y="26" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">E</text>
      <text x="46" y="24" fill="#34d399" font-size="13" font-weight="600">Binary Serialization &amp; ABI Manifest</text>
      <text x="46" y="42" fill="#e2e8f0" font-size="11">Generates SOF ABI manifest (ABI 3.23 / 4.x)</text>
      <text x="46" y="58" fill="#94a3b8" font-size="10">Packs vendor tokens, DAI links, controls, and PCM widgets</text>
      <text x="46" y="74" fill="#64748b" font-size="10">Outputs serialized ALSA topology binary stream</text>
    </g>
  </g>

  <!-- Connector Middle -> Right -->
  <path d="M 800 365 L 835 365" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)" />

  <!-- Right Column: Binary Generation & Deployment Models -->
  <g transform="translate(840, 90)">
    <rect width="320" height="550" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect width="320" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="21" r="5" fill="#34d399" />
    <text x="35" y="26" fill="#f1f5f9" font-size="14" font-weight="600">3. Binary Targets &amp; Deployment</text>

    <!-- Output Option 1: Monolithic Topologies -->
    <g transform="translate(16, 56)">
      <rect width="288" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="12" y="12" width="16" height="16" rx="3" fill="#0284c7" />
      <text x="36" y="25" fill="#38bdf8" font-size="12" font-weight="700">MONOLITHIC TOPOLOGIES</text>
      <text x="12" y="48" fill="#cbd5e1" font-size="11" font-family="monospace">sof-tgl-nocodec.tplg</text>
      <text x="12" y="68" fill="#cbd5e1" font-size="11" font-family="monospace">sof-mtl-sdw-rt711-l0.tplg</text>
      <text x="12" y="92" fill="#94a3b8" font-size="10">Single board-specific binary containing entire graph</text>
    </g>

    <!-- Output Option 2: Split Functional Topologies -->
    <g transform="translate(16, 178)">
      <rect width="288" height="150" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1" />
      <rect x="12" y="12" width="16" height="16" rx="3" fill="#059669" />
      <text x="36" y="25" fill="#34d399" font-size="12" font-weight="700">SPLIT FUNCTIONAL TOPOLOGIES</text>
      <text x="12" y="48" fill="#cbd5e1" font-size="11" font-family="monospace">sof-sdca-jack-id0.tplg</text>
      <text x="12" y="68" fill="#cbd5e1" font-size="11" font-family="monospace">sof-sdca-2amp-id2.tplg</text>
      <text x="12" y="88" fill="#cbd5e1" font-size="11" font-family="monospace">sof-sdca-mic-id4.tplg</text>
      <text x="12" y="108" fill="#cbd5e1" font-size="11" font-family="monospace">sof-ptl-dmic-2ch-id5.tplg</text>
      <text x="12" y="132" fill="#94a3b8" font-size="10">Per-endpoint sub-topologies loaded dynamically</text>
    </g>

    <!-- Output Option 3: Feature Topologies -->
    <g transform="translate(16, 340)">
      <rect width="288" height="110" rx="8" fill="#1e293b" stroke="#d97706" stroke-width="1" />
      <rect x="12" y="12" width="16" height="16" rx="3" fill="#d97706" />
      <text x="36" y="25" fill="#fbbf24" font-size="12" font-weight="700">FEATURE TOPOLOGIES</text>
      <text x="12" y="48" fill="#cbd5e1" font-size="11" font-family="monospace">sof-sdca-amp-ref.tplg</text>
      <text x="12" y="68" fill="#cbd5e1" font-size="11" font-family="monospace">sof-sdca-2amp-id2-xover.tplg</text>
      <text x="12" y="92" fill="#94a3b8" font-size="10">Overlays echo references, crossovers, deep buffers</text>
    </g>

    <!-- Kernel Driver Runtime Loader -->
    <g transform="translate(16, 462)">
      <rect width="288" height="68" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
      <text x="12" y="22" fill="#38bdf8" font-size="11" font-weight="700">LINUX SOF DRIVER RUNTIME</text>
      <text x="12" y="38" fill="#e2e8f0" font-size="10">ACPI / SDCA device matching library</text>
      <text x="12" y="54" fill="#94a3b8" font-size="9" font-family="monospace">sof_sdw_get_tplg_files() in hda.c</text>
    </g>
  </g>
</svg>
