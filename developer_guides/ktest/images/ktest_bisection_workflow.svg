<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0f172a; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="panelGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="emeraldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="roseGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="purpleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Markers -->
    <marker id="arrowCyan2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowEmerald2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#34d399" />
    </marker>
    <marker id="arrowRose2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#fb7185" />
    </marker>
    <marker id="arrowPurple2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="url(#bgGrad2)" />

  <!-- Title Header -->
  <g transform="translate(40, 26)">
    <text x="0" y="22" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.02em">Automated Kernel Regression Bisection Workflow (ktest.pl + git bisect)</text>
    <text x="0" y="44" fill="#94a3b8" font-size="13">Autonomous binary search across git commits with remote DUT hardware verification and zero manual intervention</text>
  </g>

  <!-- Top Section: Git Commit Range Visualization -->
  <g transform="translate(40, 80)">
    <rect width="1120" height="96" rx="10" fill="url(#panelGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow2)" />
    <text x="20" y="24" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.05em">GIT COMMIT SEARCH SPACE &amp; BISECTION RANGE</text>

    <!-- Timeline Line -->
    <line x1="80" y1="56" x2="1040" y2="56" stroke="#475569" stroke-width="3" stroke-dasharray="6,6" />

    <!-- Commit 1: Known Good Baseline -->
    <g transform="translate(60, 36)">
      <circle cx="20" cy="20" r="14" fill="#059669" stroke="#34d399" stroke-width="2" />
      <text x="15" y="24" fill="#ffffff" font-size="11" font-weight="700">✓</text>
      <text x="-15" y="46" fill="#34d399" font-size="11" font-weight="700">BISECT_GOOD</text>
      <text x="-6" y="58" fill="#94a3b8" font-size="10">v6.8-rc1</text>
    </g>

    <!-- Commit Midpoint: Testing -->
    <g transform="translate(540, 36)">
      <circle cx="20" cy="20" r="16" fill="#7c3aed" stroke="#c084fc" stroke-width="2" />
      <text x="14" y="24" fill="#ffffff" font-size="11" font-weight="700">?</text>
      <text x="-20" y="48" fill="#c084fc" font-size="11" font-weight="700">MIDPOINT COMMIT</text>
      <text x="-12" y="60" fill="#cbd5e1" font-size="10">git bisect next</text>
    </g>

    <!-- Commit Culprit: Hidden Bug -->
    <g transform="translate(740, 36)">
      <circle cx="20" cy="20" r="12" fill="#334155" stroke="#fb7185" stroke-width="1.5" />
      <text x="14" y="24" fill="#fb7185" font-size="11" font-weight="700">!</text>
      <text x="-10" y="46" fill="#fb7185" font-size="11" font-weight="600">Regression</text>
      <text x="-4" y="58" fill="#64748b" font-size="10">Culprit</text>
    </g>

    <!-- Commit Tip: Known Bad -->
    <g transform="translate(980, 36)">
      <circle cx="20" cy="20" r="14" fill="#e11d48" stroke="#fb7185" stroke-width="2" />
      <text x="16" y="24" fill="#ffffff" font-size="11" font-weight="700">✗</text>
      <text x="-10" y="46" fill="#fb7185" font-size="11" font-weight="700">BISECT_BAD</text>
      <text x="-4" y="58" fill="#94a3b8" font-size="10">origin/main</text>
    </g>
  </g>

  <!-- Middle Section: Bisection Iteration Loop -->
  <g transform="translate(40, 192)">
    <!-- Container -->
    <rect width="780" height="350" rx="12" fill="url(#panelGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow2)" />
    <rect width="780" height="38" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#38bdf8" />
    <text x="35" y="24" fill="#f1f5f9" font-size="13" font-weight="700">Autonomous Test Cycle (Repeated Each Bisect Step)</text>

    <!-- Step 1: Checkout -->
    <g transform="translate(24, 52)">
      <rect width="224" height="74" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <text x="12" y="20" fill="#38bdf8" font-size="11" font-weight="700">1. Checkout &amp; Config</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="10">git bisect next $\to$ sha1</text>
      <text x="12" y="54" fill="#64748b" font-size="10">make O=build olddefconfig</text>
    </g>
    <!-- Arrow -->
    <path d="M 252 89 L 276 89" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan2)" />

    <!-- Step 2: Build -->
    <g transform="translate(280, 52)">
      <rect width="224" height="74" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <text x="12" y="20" fill="#38bdf8" font-size="11" font-weight="700">2. Incremental Build</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="10">make -j$(nproc) bzImage</text>
      <text x="12" y="54" fill="#cbd5e1" font-size="10">make -j$(nproc) modules</text>
    </g>
    <!-- Arrow -->
    <path d="M 508 89 L 532 89" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan2)" />

    <!-- Step 3: Deploy -->
    <g transform="translate(536, 52)">
      <rect width="220" height="74" rx="8" fill="#0f172a" stroke="#7c3aed" stroke-width="1" />
      <text x="12" y="20" fill="#c084fc" font-size="11" font-weight="700">3. SSH Deployment</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="10">SCP bzImage &amp; modules</text>
      <text x="12" y="54" fill="#64748b" font-size="10">arm grub-reboot "test"</text>
    </g>

    <!-- Down Arrow from Step 3 to Step 4 -->
    <path d="M 646 130 L 646 150" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple2)" />

    <!-- Step 4: Boot & Watchdog -->
    <g transform="translate(536, 154)">
      <rect width="220" height="78" rx="8" fill="#0f172a" stroke="#7c3aed" stroke-width="1" />
      <text x="12" y="20" fill="#c084fc" font-size="11" font-weight="700">4. Reboot &amp; Watchdog</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="10">Target reboots to test kernel</text>
      <text x="12" y="54" fill="#cbd5e1" font-size="10">UART / SSH login check</text>
      <text x="12" y="70" fill="#fb7185" font-size="9">Crash $\to$ auto-recovers to safe kernel</text>
    </g>

    <!-- Left Arrow from Step 4 to Step 5 -->
    <path d="M 532 193 L 508 193" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan2)" />

    <!-- Step 5: Test Execution -->
    <g transform="translate(280, 154)">
      <rect width="224" height="78" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1" />
      <text x="12" y="20" fill="#34d399" font-size="11" font-weight="700">5. Hardware Sound Validation</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="10">dmesg | grep "sof-audio"</text>
      <text x="12" y="54" fill="#cbd5e1" font-size="10">aplay -l &amp; arecord loopback</text>
      <text x="12" y="70" fill="#34d399" font-size="9">Exit 0 = PASS | Exit non-zero = FAIL</text>
    </g>

    <!-- Left Arrow from Step 5 to Step 6 -->
    <path d="M 276 193 L 252 193" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan2)" />

    <!-- Step 6: Evaluation -->
    <g transform="translate(24, 154)">
      <rect width="224" height="78" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1" />
      <text x="12" y="20" fill="#fbbf24" font-size="11" font-weight="700">6. Bisection Branching</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="10">SUCCESS $\to$ git bisect good</text>
      <text x="12" y="54" fill="#cbd5e1" font-size="10">FAILURE $\to$ git bisect bad</text>
      <text x="12" y="70" fill="#94a3b8" font-size="9">BUILD ERROR $\to$ git bisect skip</text>
    </g>

    <!-- Loop Feedback Banner -->
    <g transform="translate(24, 252)">
      <rect width="732" height="78" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" fill="#38bdf8" font-size="12" font-weight="700">Autonomous Binary Convergence</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">Bisects N commits in \(\sim \log_2(N)\) steps without manual intervention.</text>
      <text x="16" y="62" fill="#94a3b8" font-size="11">Example: Isolating an audio crash across 1,024 commits requires only 10 automated test boots!</text>
    </g>
  </g>

  <!-- Right Section: Bisect Result Output Card -->
  <g transform="translate(835, 192)">
    <rect width="325" height="350" rx="12" fill="url(#panelGrad2)" stroke="#e11d48" stroke-width="1.5" filter="url(#dropShadow2)" />
    <rect width="325" height="38" rx="12" fill="#881337" stroke="#e11d48" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#fb7185" />
    <text x="35" y="24" fill="#fff" font-size="13" font-weight="700">Bisection Result Output</text>

    <!-- Terminal Emulation Box -->
    <g transform="translate(14, 52)">
      <rect width="297" height="278" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" fill="#34d399" font-size="11" font-family="monospace">$ ./ktest.pl bisect.conf</text>
      <text x="12" y="44" fill="#94a3b8" font-size="10" font-family="monospace">[...] Bisecting: 0 revisions left</text>
      <text x="12" y="62" fill="#cbd5e1" font-size="10" font-family="monospace">Testing commit d48e2a1b9...</text>
      <text x="12" y="80" fill="#fb7185" font-size="10" font-family="monospace">*** TEST FAILED (Audio probe err) ***</text>
      <line x1="12" y1="94" x2="285" y2="94" stroke="#334155" stroke-width="1" />
      <text x="12" y="114" fill="#fbbf24" font-size="11" font-weight="700" font-family="monospace">Culprit Commit Identified:</text>
      <text x="12" y="134" fill="#f8fafc" font-size="10" font-family="monospace">commit d48e2a1b9f7c0412...</text>
      <text x="12" y="152" fill="#94a3b8" font-size="10" font-family="monospace">Author: dev@example.org</text>
      <text x="12" y="170" fill="#94a3b8" font-size="10" font-family="monospace">Date:   Wed Jun 12 14:22:01</text>
      <text x="12" y="196" fill="#38bdf8" font-size="10" font-family="monospace">ASoC: SOF: intel: fix HDA</text>
      <text x="12" y="214" fill="#38bdf8" font-size="10" font-family="monospace">stream DMA buffer pointer</text>
      <line x1="12" y1="228" x2="285" y2="228" stroke="#334155" stroke-width="1" />
      <text x="12" y="248" fill="#34d399" font-size="10" font-family="monospace">SUCCESS: Bisect complete!</text>
      <text x="12" y="266" fill="#94a3b8" font-size="9" font-family="monospace">Total time elapsed: 48m 12s</text>
    </g>
  </g>

  <!-- Bottom Bar: ktest.conf Key Directives Summary -->
  <g transform="translate(40, 560)">
    <rect width="1120" height="96" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="22" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.05em">KEY KTEST BISECTION DIRECTIVES</text>

    <!-- Directive 1 -->
    <g transform="translate(20, 32)">
      <rect width="255" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="18" fill="#38bdf8" font-size="10" font-weight="700">TEST_TYPE = bisect</text>
      <text x="10" y="32" fill="#cbd5e1" font-size="10">BISECT_TYPE = git</text>
      <text x="10" y="46" fill="#64748b" font-size="9">Enables automated binary search mode</text>
    </g>

    <!-- Directive 2 -->
    <g transform="translate(290, 32)">
      <rect width="255" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="18" fill="#34d399" font-size="10" font-weight="700">BISECT_GOOD = v6.8-rc1</text>
      <text x="10" y="32" fill="#fb7185" font-size="10">BISECT_BAD = origin/main</text>
      <text x="10" y="46" fill="#64748b" font-size="9">Defines the regression boundaries</text>
    </g>

    <!-- Directive 3 -->
    <g transform="translate(560, 32)">
      <rect width="255" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="18" fill="#fbbf24" font-size="10" font-weight="700">REBOOT_TYPE = grub2</text>
      <text x="10" y="32" fill="#cbd5e1" font-size="10">GRUB_MENU = test</text>
      <text x="10" y="46" fill="#64748b" font-size="9">Safe 1-shot boot via grub-reboot</text>
    </g>

    <!-- Directive 4 -->
    <g transform="translate(830, 32)">
      <rect width="270" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="18" fill="#c084fc" font-size="10" font-weight="700">TEST = /root/test_sof_audio.sh</text>
      <text x="10" y="32" fill="#cbd5e1" font-size="10">CONSOLE = cat ${THIS_DIR}/console.log</text>
      <text x="10" y="46" fill="#64748b" font-size="9">Post-boot evaluation pass/fail criteria</text>
    </g>
  </g>
</svg>
