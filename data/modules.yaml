# SOF Supported Algorithms & Processing Modules Database (Single Source of Truth)

modules:
  # --- Basic Routing & Foundational DSP ---
  - id: volume
    name: "Volume / Mute"
    source: "SOF"
    category: "Basic Routing & Level"
    status: "Upstream"
    description: "Multi-channel software volume attenuation, smooth ramp, and mute control."
    simd: ["ARM", "HiFi 3", "HiFi 4", "HiFi 5", "RISCV", "Scalar C"]
    key_features:
      - "Per-channel linear and log gain curves"
      - "Smooth zipper noise attenuation"
      - "Zero-overhead bypass when set to 0dB"

  - id: mixer
    name: "Audio Mixer"
    source: "SOF"
    category: "Basic Routing & Level"
    status: "Upstream"
    description: "N-to-M channel audio stream summer with clipping protection and saturation."
    simd: ["ARM", "HiFi 3", "HiFi 5", "RISCV", "Scalar C"]
    key_features:
      - "Concurrent playback mixing"
      - "Dynamic input stream attachment/detachment"
      - "Saturation and clipping protection"

  - id: src
    name: "Sample Rate Converter (SRC)"
    source: "SOF"
    category: "Foundational DSP"
    status: "Upstream"
    description: "Polyphase FIR resampler converting between standard sample rates (8kHz to 192kHz)."
    simd: ["HiFi 2 EP", "HiFi 3", "HiFi 4", "HiFi 5", "RISCV", "Scalar C"]
    key_features:
      - "High SNR polyphase filtering"
      - "Low group delay"
      - "Multi-channel synchronous resampling"

  - id: asrc
    name: "Asynchronous SRC (ASRC)"
    source: "SOF"
    category: "Foundational DSP"
    status: "Upstream"
    description: "Drift-compensated asynchronous sample rate converter for independent clock domains."
    simd: ["HiFi 3", "HiFi 5", "RISCV", "Scalar C"]
    key_features:
      - "Farrow polynomial interpolation"
      - "Continuous clock drift tracking"
      - "Decoupled clock domain bridging"

  - id: dmic
    name: "Digital Microphone (DMIC) Decimation & Array Tuning"
    source: "SOF"
    category: "Foundational DSP"
    status: "Upstream"
    tuning_guide: "developer_guides/tuning/dmic_tuning"
    description: "Hardware PDM ingress, 5th-order CIC comb decimation, multirate FIR droop compensation, DC-offset compensation, and multichannel array acoustic calibration."
    simd: ["Hardware Accelerator", "Scalar C"]
    key_features:
      - "5th-order Cascaded Integrator-Comb (CIC) filter with up to 31x decimation"
      - "Multirate droop-compensating FIR filters with passband ripple < 0.1 dB and stopband > 90 dB"
      - "Dual-FIFO mode matching for concurrent 48 kHz communications and 16 kHz wake-on-voice"
      - "Acoustic sensitivity calibration and inter-channel gain trimming for beamforming arrays"
      - "Automated logarithmic unmute gain ramping eliminating stream start pops"
      - "Standalone Python calibration CLI (sof_dmic_tool.py) and ACPI NHLT / Topology 2 integration"

  - id: demux
    name: "Audio Demux"
    source: "SOF"
    category: "Basic Routing & Level"
    status: "Upstream"
    description: "Demultiplexes a single multi-channel audio stream into multiple downstream sink pipelines."
    simd: ["Scalar C"]
    key_features:
      - "Multi-channel stream demultiplexing"
      - "Dynamic route splitting"
      - "Zero-copy sample extraction"

  - id: mux
    name: "Audio Mux"
    source: "SOF"
    category: "Basic Routing & Level"
    status: "Upstream"
    description: "Multiplexes multiple synchronized input streams into a combined multi-channel output stream."
    simd: ["Scalar C"]
    key_features:
      - "Multi-source stream multiplexing"
      - "Configurable input channel mapping"
      - "Synchronized buffer alignment"

  - id: channel_map
    name: "Channel Map / Remap"
    source: "SOF"
    category: "Basic Routing & Level"
    status: "Upstream"
    description: "Flexible channel remapping, slot swapping, and channel replication component."
    simd: ["Scalar C"]
    key_features:
      - "Arbitrary slot and channel routing"
      - "Mono to stereo/surround replication"
      - "Channel swap and mute masking"

  - id: level_multiplier
    name: "Level Multiplier"
    source: "SOF"
    category: "Basic Routing & Level"
    status: "Upstream"
    description: "Ultra-low-latency Q9.23 linear scaling amplifier for capture sensitivity calibration and inter-stage matching."
    simd: ["HiFi 3", "HiFi 4", "HiFi 5", "Scalar C"]
    key_features:
      - "High-precision Q9.23 fixed-point multiplier (-138.47 dB to +48.17 dB)"
      - "Zero-overhead fast-path bypass when configured for unity gain (0 dB)"
      - "Runtime IPC4 calibration and LLEXT dynamic module packaging"
    tuning_guide: "developer_guides/tuning/level_multiplier_aria_tuning"

  - id: up_down_mixer
    name: "Up/Down Mixer"
    source: "SOF"
    category: "Basic Routing & Level"
    status: "Upstream"
    description: "Configurable matrix-based channel upmixer and downmixer with per-coefficient attenuation."
    simd: ["HiFi 3", "HiFi 4", "HiFi 5", "Scalar C"]
    key_features:
      - "Matrix coefficients for stereo, surround 5.1, and 7.1 mapping"
      - "Channel energy normalization and clipping prevention"
      - "Zero-copy passthrough when channel geometry matches"

  - id: tone
    name: "Tone Generator"
    source: "SOF"
    category: "Diagnostics & Testing"
    status: "Upstream"
    description: "Synthesizes diagnostic test tones for audio path verification."
    simd: ["RISCV", "Scalar C"]
    key_features:
      - "Sine wave generation"
      - "Configurable frequency and amplitude"
      - "Per-channel tone routing"

  # --- Audio Enhancement & Filtering ---
  - id: eq_fir
    name: "Parametric Equalizer (EQ FIR)"
    source: "SOF"
    category: "Audio Enhancement"
    status: "Upstream"
    description: "High-order finite impulse response (FIR) filter for precise phase and frequency response tuning."
    simd: ["ARM", "HiFi 2 EP", "HiFi 3", "HiFi 4", "HiFi 5", "RISCV", "Scalar C"]
    key_features:
      - "High-order linear-phase FIR filtering"
      - "Speaker and room impulse response correction"
      - "Live runtime coefficient updates over IPC"

  - id: eq_iir
    name: "Parametric Equalizer (EQ IIR)"
    source: "SOF"
    category: "Audio Enhancement"
    status: "Upstream"
    description: "Cascaded biquad infinite impulse response (IIR) parametric equalizer."
    simd: ["ARM", "HiFi 2 EP", "HiFi 3", "HiFi 4", "HiFi 5", "RISCV", "Scalar C"]
    key_features:
      - "Cascaded second-order biquad sections"
      - "Parametric peak, notch, low/high shelf"
      - "Low computational latency"

  - id: aria
    name: "Aria (Automatic Regressive Input Amplifier)"
    source: "SOF"
    category: "Audio Enhancement"
    status: "Upstream"
    description: "Dynamic pre-amplifier and lookahead peak limiter with 1ms algorithmic latency."
    simd: ["HiFi 3", "HiFi 4", "HiFi 5", "Scalar C"]
    key_features:
      - "Target pre-amplification boost (0, 6, 12, 18 dB)"
      - "Instantaneous regressive ducking to prevent 0 dBFS clipping"
      - "1ms lookahead circular buffer and per-sample linear interpolation"
    tuning_guide: "developer_guides/tuning/level_multiplier_aria_tuning"

  - id: drc
    name: "Dynamic Range Compressor (DRC)"
    source: "SOF"
    category: "Audio Enhancement"
    status: "Upstream"
    description: "Wideband dynamic range compressor with configurable attack, release, and threshold curves."
    simd: ["ARM", "HiFi 3", "HiFi 4", "RISCV", "Scalar C"]
    key_features:
      - "Speaker excursion and thermal protection"
      - "Configurable attack, release, and knee"
      - "Peak and RMS signal level detection"

  - id: multiband_drc
    name: "Multiband DRC"
    source: "SOF"
    category: "Audio Enhancement"
    status: "Upstream"
    description: "Multi-band dynamic range compressor with independent compression across frequency subbands."
    simd: ["HiFi 3", "HiFi 4", "RISCV", "Scalar C"]
    key_features:
      - "Subband crossover splitting"
      - "Per-band threshold and ratio controls"
      - "Comprehensive speaker protection"

  - id: crossover
    name: "Crossover Filter"
    source: "SOF"
    category: "Audio Enhancement"
    status: "Upstream"
    description: "2-way and 3-way Linkwitz-Riley crossover filter for multi-driver audio systems."
    simd: ["HiFi 3", "RISCV", "Scalar C"]
    key_features:
      - "Linkwitz-Riley 4th order (LR4) splitting"
      - "Flat magnitude sum across crossover point"
      - "Multi-way woofer, tweeter, and sub routing"

  - id: dcblock
    name: "DC Blocker"
    source: "SOF"
    category: "Audio Enhancement"
    status: "Upstream"
    description: "High-pass filter removing hardware DC bias and sub-audible hum."
    simd: ["ARM", "HiFi 3", "HiFi 4", "RISCV", "Scalar C"]
    key_features:
      - "Removes DC bias from digital mics and ADCs"
      - "Sub-audible rumble attenuation"
      - "Near-zero phase distortion in audio band"

  - id: phase_vocoder
    name: "Phase Vocoder"
    source: "SOF"
    category: "Audio Enhancement"
    status: "Upstream"
    description: "Frequency-domain time-scale modification (0.5x to 2.0x speed) without pitch alteration."
    simd: ["HiFi 3", "Scalar C"]
    key_features:
      - "Real-time Short-Time Fourier Transform (STFT) analysis & synthesis"
      - "Variable speed scaling (0.5x to 2.0x) with exact GCD counter normalization"
      - "Interactive phase re-anchoring and mono downmix optimization"

  - id: stft_process
    name: "STFT Process"
    source: "SOF"
    category: "Audio Enhancement"
    status: "Upstream"
    description: "Modular Short-Time Fourier Transform frequency-domain filtering and synthesis engine."
    simd: ["HiFi 3", "Scalar C"]
    key_features:
      - "Multi-channel 32-bit forward and inverse FFT with COLA windowing"
      - "Dual-domain processing: Cartesian complex and polar magnitude/phase"
      - "Single contiguous buffer layout and zero-copy polar memory overlay"

  - id: smart_amp
    name: "Smart Amp Protection (DSM)"
    source: "SOF"
    category: "Speaker Protection"
    status: "Upstream"
    description: "Closed-loop dynamic speaker management monitoring real-time voltage/current (I/V) feedback to maximize loudness and prevent mechanical and thermal destruction."
    simd: ["HiFi 3", "HiFi 4", "Scalar C"]
    key_features:
      - "Real-time voice coil temperature estimation via continuous Re(t) tracking"
      - "Nonlinear membrane excursion prediction and adaptive high-pass limiting"
      - "Closed-loop hardware I/V sense feedback via SoundWire and I2S/TDM"
      - "Two-layer modular architecture supporting Maxim DSM and vendor engines"
      - "Live runtime parameter injection and telemetry readback via sof-ctl"

  - id: sound_dose
    name: "Sound Dose & Exposure"
    source: "SOF"
    category: "Speaker Protection"
    status: "Upstream"
    description: "Auditory health monitoring and cumulative sound exposure limiter complying with IEC 62368-1 Clause 10.6, EN 50332-1/-2/-3, and WHO-ITU H.870."
    simd: ["HiFi 3", "Scalar C"]
    key_features:
      - "IEC 61672-1 Class 1 A-weighting cascaded Direct Form I IIR biquad filtering"
      - "Overflow-proof 64-bit real-time energy accumulation and integer base-2 logarithm decibel conversion"
      - "Autonomous 1-second asynchronous IPC4 notification dispatch without host polling"
      - "Smooth per-frame exponential slew gain limiter (0.05 dB/frame) eliminating clicks and pops"
      - "Acoustic laboratory HATS calibration, rolling 7-day CSD tracking, and runtime control via sof-ctl"

  # --- Voice, Telephony & Speech ---
  - id: tdfb
    name: "Beamformer (TDFB)"
    source: "SOF"
    category: "Voice & Telephony"
    status: "Upstream"
    description: "Time-Domain Fixed Beamformer combining multi-microphone inputs to isolate target speakers."
    simd: ["HiFi 2 EP", "HiFi 3", "HiFi 4", "HiFi 5", "RISCV", "Scalar C"]
    key_features:
      - "Multi-mic circular and linear array support"
      - "Broadside and endfire steering"
      - "Spatial diffuse noise suppression"

  - id: webrtc_aec
    name: "WebRTC Echo Cancellation (AEC)"
    source: "WebRTC"
    category: "Voice & Telephony"
    status: "Active Development"
    description: "Full-duplex acoustic echo cancellation removing loudspeaker playback from microphone capture."
    simd: ["HiFi 3", "HiFi 4", "VFPU", "Scalar C"]
    key_features:
      - "Subband adaptive filter convergence"
      - "Multi-channel reference loopback alignment"
      - "Robust double-talk detection"

  - id: webrtc_aecm
    name: "WebRTC Mobile AEC (AECM)"
    source: "WebRTC"
    category: "Voice & Telephony"
    status: "Active Development"
    description: "Lightweight mobile acoustic echo canceller tailored for power-constrained DSPs and embedded targets."
    simd: ["HiFi 3", "HiFi 4", "VFPU", "Scalar C"]
    key_features:
      - "Fixed-point low-complexity processing"
      - "Optimized for earbuds and wearables"
      - "Low RAM and cycle footprint"

  - id: webrtc_ns
    name: "WebRTC Noise Suppression (NS)"
    source: "WebRTC"
    category: "Voice & Telephony"
    status: "Active Development"
    description: "Spectral subtraction stationary noise suppression for voice clarity."
    simd: ["HiFi 3", "HiFi 4", "VFPU", "Scalar C"]
    key_features:
      - "Stationary background noise reduction"
      - "Configurable aggressiveness levels"
      - "Preserves speech formant clarity"

  - id: webrtc_ns2
    name: "WebRTC Neural NS (NS2 / RNNoise)"
    source: "WebRTC"
    category: "Voice & Telephony"
    status: "Active Development"
    description: "Recurrent neural network deep learning noise suppression for non-stationary acoustic noise."
    simd: ["HiFi 3", "HiFi 4", "VFPU", "Scalar C"]
    key_features:
      - "Recurrent neural network (RNN) inference"
      - "Non-stationary transient noise elimination"
      - "High speech perceptual quality"

  - id: webrtc_vad
    name: "WebRTC Voice Activity Detector (VAD)"
    source: "WebRTC"
    category: "Voice & Telephony"
    status: "Active Development"
    description: "Low-power speech presence detector for call management and pipeline gating."
    simd: ["HiFi 3", "Scalar C"]
    key_features:
      - "Multi-band energy likelihood estimation"
      - "Sub-frame voice decision gating"
      - "Ultra-low power listening states"

  - id: webrtc_agc
    name: "WebRTC Automatic Gain Control (AGC)"
    source: "WebRTC"
    category: "Voice & Telephony"
    status: "Active Development"
    description: "Adaptive digital gain controller and peak limiter for uniform speech loudness."
    simd: ["HiFi 3", "HiFi 4", "Scalar C"]
    key_features:
      - "Dynamic gain adjustment"
      - "Saturation prevention limiter"
      - "Normalizes quiet and loud speakers"

  - id: wov_kpb
    name: "Key Phrase Buffer (KPB / WoV)"
    source: "SOF"
    category: "Voice & Telephony"
    status: "Upstream"
    description: "Low-power Wake-on-Voice pre-roll history circular buffer."
    simd: ["Scalar C"]
    key_features:
      - "Ultra-low power DSP listening mode (D0ix)"
      - "Zero-latency audio pre-roll buffer playback"
      - "Multi-slot capture streaming to host"

  - id: microwakeword
    name: "microWakeWord (TFLite Micro)"
    source: "Google"
    category: "Voice & Telephony"
    status: "Active Development"
    description: "Embedded deep neural network keyword detector running on TensorFlow Lite for Microcontrollers."
    simd: ["HiFi 3", "HiFi 4", "Scalar C"]
    key_features:
      - "On-device neural network keyword spotting"
      - "TFLite Micro runtime execution"
      - "Low false-reject and false-alarm rates"

  - id: mfcc
    name: "Mel-Frequency Cepstral Coefficients (MFCC)"
    source: "SOF"
    category: "Voice & Telephony"
    status: "Upstream"
    description: "Speech feature extraction engine computing triangular Mel filterbank energies, Slaney normalization, and DCT-II cepstra."
    tuning_guide: "developer_guides/tuning/mfcc_tuning"
    simd: ["HiFi 3", "HiFi 4", "Scalar C"]
    key_features:
      - "Configurable triangular Mel filterbanks (20 Hz to 8 kHz) with Slaney area normalization"
      - "Dual-mode operation: 80-bin Mel spectrogram (Whisper ASR) or 13-cepstra MFCC (TFLM microWakeWord)"
      - "Discrete Cosine Transform (DCT-II) with sinusoidal cepstral liftering"
      - "Embedded Voice Activity Detection (VAD) and Discontinuous Transmission (DTX) silence suppression"
      - "Sparse packed triangular filterbank vector storage with >95% SRAM memory reduction"

  - id: mic_privacy_manager
    name: "Microphone Privacy Manager"
    source: "SOF"
    category: "Voice & Telephony"
    status: "Upstream"
    description: "Hardware-enforced microphone capture mute and privacy state management."
    simd: ["Scalar C"]
    key_features:
      - "Zero-sample hardware mute interlock"
      - "GPIO privacy LED synchronization"
      - "Host-independent privacy state enforcement"

  - id: rtnr
    name: "Realtek Neural Noise Reduction (RTNR)"
    source: "Realtek"
    category: "Voice & Telephony"
    status: "Upstream"
    description: "Deep neural network noise suppression engine isolating speech from non-stationary background noise."
    simd: ["HiFi 4", "Scalar C"]
    key_features:
      - "Neural network recurrent inference"
      - "Non-stationary transient acoustic noise suppression"
      - "Dual-microphone directional voice enhancement"

  # --- Codecs & Compression ---
  - id: media_codecs
    name: "Media Codecs (Cadence XA & Compress-Offload)"
    source: "SOF / Cadence"
    category: "Codecs & Compression"
    status: "Upstream"
    description: "Hardware-accelerated compressed audio offload decoders and encoders using the Cadence Xtensa Audio (XA) standard."
    simd: ["HiFi 3", "HiFi 4", "HiFi 5", "Scalar C"]
    key_features:
      - "ALSA compress-offload playback (MP3, AAC, Vorbis, PCM passthrough) and capture (MP3 enc)"
      - "Standardized Cadence Xtensa Audio (XA) four-class memory tables and state machine"
      - "Deep-buffer DMA host wakeup suppression enabling prolonged C10 deep sleep"

  - id: aac_dec
    name: "AAC Decoder"
    source: "FFmpeg"
    category: "Codecs & Compression"
    status: "Active Development"
    description: "MPEG-4 Advanced Audio Coding (AAC-LC / HE-AAC) decoder."
    simd: ["VFPU", "HiFi 3", "HiFi 4", "HiFi 5", "Scalar C"]
    key_features:
      - "Vector floating-point hardware acceleration"
      - "MPEG-4 AAC-LC and HE-AAC profile support"
      - "Direct pipeline integration"

  - id: aac_enc
    name: "AAC Encoder"
    source: "FFmpeg"
    category: "Codecs & Compression"
    status: "Active Development"
    description: "MPEG-4 AAC audio bitstream encoder for Bluetooth and streaming egress."
    simd: ["VFPU", "HiFi 3", "HiFi 4", "HiFi 5", "Scalar C"]
    key_features:
      - "Low-power bitstream encoding"
      - "Configurable bitrates and sample rates"
      - "Optimized MDCT and psychoacoustic model"

  - id: mp3_dec
    name: "MP3 Decoder"
    source: "FFmpeg"
    category: "Codecs & Compression"
    status: "Active Development"
    description: "MPEG-1/2 Audio Layer III decoder leveraging optimized subband synthesis and MDCT."
    simd: ["VFPU", "HiFi 3", "HiFi 4", "HiFi 5", "Scalar C"]
    key_features:
      - "Hardware VFPU SIMD acceleration"
      - "High-throughput low-overhead DSP execution"
      - "Full bit reservoir and Huffman decoding"

  - id: mp3_enc
    name: "MP3 Encoder"
    source: "FFmpeg"
    category: "Codecs & Compression"
    status: "Active Development"
    description: "Real-time fixed-point MP3 audio encoder for recording and broadcast."
    simd: ["VFPU", "HiFi 3", "HiFi 4", "Scalar C"]
    key_features:
      - "Low-complexity fixed-point encoding"
      - "Efficient subband analysis filterbank"
      - "Standard MPEG-1 Layer III bitstream generation"

  - id: flac_dec
    name: "FLAC Decoder"
    source: "FFmpeg"
    category: "Codecs & Compression"
    status: "Active Development"
    description: "Free Lossless Audio Codec decoder delivering bit-exact high-resolution audio."
    simd: ["VFPU", "HiFi 3", "HiFi 4", "Scalar C"]
    key_features:
      - "Lossless 16/24-bit audio decompression"
      - "Fast linear prediction decoding"
      - "Zero fidelity loss playback"

  - id: opus_dec
    name: "Opus Decoder"
    source: "FFmpeg"
    category: "Codecs & Compression"
    status: "Active Development"
    description: "Interactive speech and music decoder optimized for ultra-low delay streaming."
    simd: ["VFPU", "HiFi 3", "HiFi 4", "Scalar C"]
    key_features:
      - "SILK speech and CELT music mode support"
      - "Sub-20ms algorithmic latency"
      - "Dynamic bitrate and bandwidth adaptation"

  - id: vorbis_dec
    name: "Vorbis Decoder"
    source: "FFmpeg"
    category: "Codecs & Compression"
    status: "Active Development"
    description: "Ogg Vorbis lossy audio decoder with variable bitrate support."
    simd: ["VFPU", "HiFi 3", "HiFi 4", "Scalar C"]
    key_features:
      - "General-purpose variable bitrate decompression"
      - "Vector quantization floor decoding"
      - "Low memory footprint"

  # --- Spatial Audio ---
  - id: steam_audio
    name: "Steam Audio Spatializer"
    source: "Steam Audio"
    category: "Spatial Audio"
    status: "Active Development"
    description: "3D binaural spatializer using Head-Related Transfer Functions (HRTF)."
    simd: ["VFPU", "HiFi 4", "HiFi 5", "Scalar C"]
    key_features:
      - "Spherical 3D sound positioning"
      - "Convolution-based HRTF binaural rendering"
      - "Dynamic listener and source orientation"

  # --- Diagnostics & Tools ---
  - id: probes_telemetry
    name: "Real-Time Probes & Telemetry"
    source: "SOF"
    category: "Diagnostics & Tools"
    status: "Upstream"
    description: "Non-intrusive runtime audio probing and log extraction across pipeline points."
    simd: ["Scalar C"]
    key_features:
      - "Direct probe DMA streaming over TCP port 9999"
      - "Zero overhead when probe taps are inactive"
      - "Multi-point simultaneous stream tapping"
